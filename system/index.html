<!DOCTYPE html>
<html lang="en">
<head>
<!-- THE COMPLETE NUTRITION SYSTEM DOCUMENT · dashboard.legacyperformance.co/system/
     One page for both jobs:
       Jayme builds a member's first system here and downloads the PDF to send her.
       The member opens it from her dashboard, rebuilds any time, and downloads her own PDF.
     Everything comes from the shared engine (nutrition-engine.js) and verified restaurant data.
     Inputs come from the URL (#d=base64 JSON, set by the dashboard / Command Center), else the
     last build on this device, else a clearly labelled example.
     Design: Legacy Dark (dashboard-studio references/legacy-dark-design.md). -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1e1e1e">
<title>Complete Nutrition System | Legacy Performance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<style>
:root{--ink:#161616;--olive:#4A5C3E;--olive-lt:#8FA97A;--olive-dim:rgba(143,169,122,.22);--parch:#F2EDE4;--gold:#C1AD72;
  --gold-dim:rgba(193,173,114,.28);--soft:#bdb7ac;--body:#d9d3c8;--line:rgba(242,237,228,.12)}
*{box-sizing:border-box;margin:0;padding:0}
html{background:#1a1a1a}
body{min-height:100vh;font-family:Montserrat,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--parch);
  -webkit-font-smoothing:antialiased;line-height:1.55;background:transparent;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(ellipse 55% 30% at 100% 0%, rgba(193,173,114,.15), transparent 70%),
    radial-gradient(ellipse 85% 55% at 0% 100%, rgba(84,106,70,.55), transparent 72%),
    radial-gradient(ellipse 90% 55% at 15% 30%, rgba(74,92,62,.07), transparent 72%),
    linear-gradient(180deg,#1e1e1e 0%,#1a1a1a 55%,#151515 100%)}
.topbar{height:5px;background:linear-gradient(90deg,#4A5C3E 0%,#8FA97A 45%,#C1AD72 85%,#e3d3a1)}
a{color:var(--gold)}
h1,h2,h3{font-family:Montserrat,Helvetica,Arial,sans-serif;color:#fff;text-transform:uppercase;letter-spacing:-.005em}
.label{font-family:Cinzel,Georgia,serif;font-size:.74rem;letter-spacing:.3em;text-transform:uppercase;color:var(--olive-lt);font-weight:600;display:block}
.eyebrow{font-family:Cinzel,Georgia,serif;font-size:.8rem;letter-spacing:.32em;text-transform:uppercase;color:var(--gold);display:block}
.gold{color:var(--gold)}
.wrap{max-width:900px;margin:0 auto;padding:0 20px}
.tile{background:linear-gradient(90deg,rgba(84,106,70,.16),rgba(255,255,255,.035));border:1px solid var(--olive-dim);border-left:3px solid var(--olive-lt);border-radius:14px}
.panel{background:linear-gradient(90deg,rgba(84,106,70,.24),rgba(255,255,255,.035));border:1px solid var(--olive-dim);border-radius:16px}
.btn{display:inline-block;background:var(--gold);color:#161616;border:0;cursor:pointer;font-family:inherit;font-weight:800;font-size:.84rem;
  letter-spacing:.06em;text-transform:uppercase;padding:13px 20px;border-radius:10px;text-decoration:none}
.btn.line{background:transparent;color:var(--gold);border:1px solid var(--gold-dim)}
.btn:focus-visible,.pill:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--olive-lt);outline-offset:2px}

/* ---------- builder (screen only) ---------- */
.tools{padding:22px 0 8px}
.tools-head{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.tools-head img{height:44px}
.tools-actions{display:flex;gap:10px;flex-wrap:wrap}
.status{margin-top:14px;font-size:.86rem;color:var(--soft)}
.status b{color:var(--gold)}
details.builder{margin-top:16px;padding:0}
details.builder>summary{list-style:none;cursor:pointer;padding:16px 20px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;font-size:.86rem;color:#fff}
details.builder>summary::-webkit-details-marker{display:none}
details.builder>summary:after{content:" +";color:var(--gold)}
details.builder[open]>summary:after{content:" \2013"}
.bld{padding:0 20px 20px;display:grid;gap:18px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.f label{display:block;font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);margin-bottom:5px}
.f input,.f select{width:100%;background:rgba(0,0,0,.26);border:1px solid rgba(242,237,228,.16);border-radius:9px;color:var(--parch);
  padding:10px 12px;font-family:inherit;font-size:.95rem;color-scheme:dark}
.f select option{background:#1e1e1e}
.pickgroup .glabel{font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);margin-bottom:7px}
.pills{display:flex;flex-wrap:wrap;gap:7px}
.pill{border:1px solid rgba(242,237,228,.16);background:rgba(255,255,255,.04);color:var(--parch);border-radius:999px;padding:7px 12px;
  font-family:inherit;font-size:.8rem;font-weight:600;cursor:pointer}
.pill.on{background:var(--olive);border-color:var(--olive-lt);color:#fff}
.hint{font-size:.8rem;color:var(--soft)}

/* ---------- the document ---------- */
.doc{padding:10px 0 60px;display:grid;gap:22px}
.sheet{position:relative;padding:34px 34px 30px;border-radius:18px;background:rgba(0,0,0,.18);border:1px solid var(--olive-dim);overflow:hidden}
.sheet h2{font-weight:900;font-size:clamp(1.5rem,3.6vw,2.1rem);line-height:1.05;margin:8px 0 14px}
.sheet .intro{color:var(--body);max-width:62ch;margin-bottom:18px}
.sheet-foot{margin-top:22px;padding-top:12px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;font-size:.72rem;color:#8f8a80}
.cover{min-height:640px;display:flex;flex-direction:column}
.cover .mark{position:absolute;right:-110px;top:60px;width:430px;opacity:.06;pointer-events:none}
.cover img.logo{width:34%;min-width:180px;height:auto;align-self:flex-start}
.cover h1{font-weight:900;font-size:clamp(2.2rem,6vw,3.6rem);line-height:.98;margin:46px 0 12px}
.cover .who{font-size:1.05rem;color:var(--body)}
.nums{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:34px}
.num{padding:14px 12px}
.num b{display:block;font-family:Cinzel,Georgia,serif;font-size:1.55rem;color:var(--gold);line-height:1.1}
.num span{display:block;font-size:.64rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--soft);margin-top:5px}
.cover .meta{margin-top:auto;padding-top:30px;font-size:.84rem;color:var(--soft)}
.principles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pr{padding:16px 16px 14px}
.pr b{display:block;color:#fff;font-weight:800;font-size:.95rem}
.pr p{font-size:.86rem;color:var(--soft);margin-top:5px}
table{width:100%;border-collapse:collapse;font-size:.84rem}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.66rem;letter-spacing:.13em;text-transform:uppercase;color:var(--soft);font-weight:700}
td b{color:#fff}
.tablewrap{overflow-x:auto}
.slot{margin-top:20px;break-inside:avoid}
.slot-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-bottom:2px solid var(--gold);padding-bottom:6px;margin-bottom:10px}
.slot-h h3{font-size:1rem;font-weight:900}
.slot-h span{font-size:.76rem;color:var(--soft)}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.opt{padding:14px 14px 12px;break-inside:avoid}
.opt .mname{margin:4px 0 0;font:800 .86rem/1.25 Montserrat,sans-serif;color:#fff;text-transform:none;letter-spacing:0}
.opt .on{font-size:.64rem;letter-spacing:.15em;text-transform:uppercase;font-weight:800;color:var(--gold)}
.opt ul{margin:8px 0 10px 16px;font-size:.84rem;color:var(--body)}
.opt li{margin-bottom:2px}
.macros{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);border-top:1px solid var(--line);padding-top:8px}
.macros b{color:var(--olive-lt);font-size:.8rem}
.shopcols{columns:2 260px;column-gap:18px}
.shopsec{break-inside:avoid;margin-bottom:14px;padding:14px 14px 8px}
.shopsec h3{font-size:.8rem;font-weight:800;letter-spacing:.08em;color:var(--olive-lt);margin-bottom:6px}
.shopitem{display:grid;grid-template-columns:16px 1fr;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:.84rem}
.shopitem:last-child{border-bottom:0}
.box{width:13px;height:13px;border:1.5px solid var(--olive-lt);border-radius:3px;margin-top:3px}
.shopitem b{color:#fff}
.shopitem span{display:block;color:var(--soft);font-size:.78rem}
.note{font-size:.8rem;color:var(--soft);margin-top:8px}
.steps{display:grid;gap:12px;counter-reset:st}
.step{padding:14px 16px;break-inside:avoid}
.step h3{font-size:.9rem;font-weight:800;margin-bottom:6px}
.step h3:before{counter-increment:st;content:counter(st) ". ";color:var(--gold)}
.step li{font-size:.84rem;color:var(--body);margin:0 0 5px 16px}
.storage{padding:14px 16px;margin-top:12px}
.storage b{color:var(--gold)}
.swapgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.swapcol{padding:14px 14px 10px}
.swapcol h3{font-size:.84rem;font-weight:800;margin-bottom:2px}
.swapcol .sub{font-size:.72rem;color:var(--olive-lt);margin-bottom:8px;display:block}
.swapcol li{list-style:none;font-size:.8rem;color:var(--body);padding:4px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
.swapcol li span{color:var(--soft);white-space:nowrap}
.rest{padding:14px 16px;break-inside:avoid;margin-bottom:10px}
.rest h3{font-size:.9rem;font-weight:800}
.rest .order{color:var(--body);font-size:.86rem;margin-top:5px}
.rest .fit{font-size:.76rem;color:var(--gold);margin-top:4px;font-weight:600}
.rules li{margin:0 0 6px 18px;color:var(--body);font-size:.88rem}
.example{display:inline-block;background:var(--gold);color:#161616;font-size:.66rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;padding:3px 9px;border-radius:999px}

@media (max-width:720px){
  .grid4{grid-template-columns:1fr 1fr} .grid3{grid-template-columns:1fr}
  .nums{grid-template-columns:repeat(2,1fr)} .principles,.opts,.swapgrid{grid-template-columns:1fr}
  .sheet{padding:24px 18px 20px} .cover{min-height:0}
}

/* ---------- print: one member document, Legacy Dark, US Letter ---------- */
@page{size:8.5in 11in;margin:0}
@media print{
  html,body{background:#1a1a1a!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .bg{position:fixed}
  .no-print{display:none!important}
  .wrap{max-width:none;padding:0}
  .doc{padding:0;gap:0;display:block}
  .sheet{border:0;border-radius:0;background:transparent;padding:.45in .55in .4in;break-after:page;min-height:11in}
  .sheet h2{font-size:22px;margin:4px 0 8px}
  .sheet .intro{margin-bottom:6px}
  .slot{margin-top:8px}
  .slot-h{margin-bottom:6px;padding-bottom:4px}
  .opt{padding:7px 10px 6px}
  .opt .mname{font-size:11px;margin-top:2px}
  .opt ul{margin:3px 0 4px 14px;font-size:10px}
  .opt li{margin-bottom:0}
  .macros{font-size:7.5px;padding-top:4px;gap:2px 7px;letter-spacing:.03em}
  .opts{gap:8px}
  .step{padding:9px 12px}
  .step li{font-size:10.5px;margin-bottom:3px}
  .steps{gap:8px}
  .storage{padding:9px 12px;margin-top:8px;font-size:10.5px}
  .shopsec{padding:10px 12px 6px;margin-bottom:10px}
  .shopitem{padding:2px 0;font-size:9.5px;gap:6px;grid-template-columns:10px 1fr}
  .shopitem span{display:inline;margin-left:5px;font-size:8.5px}
  .shopcols{columns:3;column-gap:10px}
  .shopsec{padding:8px 10px 4px;margin-bottom:8px}
  .shopitem .box{width:8px;height:8px;margin-top:2px}
  .sheet-foot{margin-top:12px}
  .cover .mark{width:360px}
  .cover img.logo{width:3.1in;min-width:0}
  .sheet:last-child{break-after:auto}
  .cover{min-height:11in}
  .opts{grid-template-columns:repeat(3,1fr)}
  .principles{grid-template-columns:1fr 1fr}
  .swapgrid{grid-template-columns:repeat(3,1fr)}
  .nums{grid-template-columns:repeat(5,1fr)}
  body{font-size:11.5px}
  .tile,.panel,.step,.opt,.shopsec,.rest{break-inside:avoid}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="bg"></div>
<div class="topbar no-print"></div>

<div class="wrap">
  <section class="tools no-print">
    <div class="tools-head">
      <img src="../logo-white-gold.png" alt="Legacy Performance">
      <div class="tools-actions">
        <button class="btn line" type="button" id="btn-edit">Edit and rebuild</button>
        <button class="btn" type="button" id="btn-pdf">Download PDF</button>
      </div>
    </div>
    <p class="status" id="status"></p>

    <details class="builder panel" id="builder">
      <summary>Build this system</summary>
      <div class="bld">
        <div class="grid4">
          <div class="f"><label for="in-name">First name</label><input id="in-name" type="text" autocomplete="off"></div>
          <div class="f"><label for="in-cal">Calories</label><input id="in-cal" type="number" inputmode="numeric" min="900" max="5000"></div>
          <div class="f"><label for="in-pro">Protein (g)</label><input id="in-pro" type="number" inputmode="numeric" min="40" max="350"></div>
          <div class="f"><label for="in-phase">Phase</label>
            <select id="in-phase"><option>Lean</option><option>Strong</option><option>Sustain</option><option>Reverse Diet</option></select></div>
          <div class="f"><label for="in-carb">Carbs (g)</label><input id="in-carb" type="number" inputmode="numeric" min="30" max="600"></div>
          <div class="f"><label for="in-fat">Fat (g)</label><input id="in-fat" type="number" inputmode="numeric" min="20" max="250"></div>
          <div class="f"><label for="in-freq">Meals a day</label>
            <select id="in-freq"><option value="2 + shake">2 + shake</option><option value="3">3</option><option value="3 + shake">3 + shake</option><option value="4">4</option></select></div>
          <div class="f"><label for="in-style">Eating style</label>
            <select id="in-style"><option value="">No restrictions</option><option value="vegetarian">Vegetarian</option><option value="vegan">Vegan</option><option value="pescatarian">Pescatarian</option><option value="no red meat">No red meat</option><option value="no pork">No pork</option></select></div>
        </div>
        <div class="pickgroup"><div class="glabel">Allergies</div><div class="pills" id="pk-allergies"></div></div>
        <div class="pickgroup"><div class="glabel">Proteins she likes</div><div class="pills" id="pk-protein"></div></div>
        <div class="pickgroup"><div class="glabel">Carbs she likes</div><div class="pills" id="pk-carb"></div></div>
        <div class="pickgroup"><div class="glabel">Fats she likes</div><div class="pills" id="pk-fat"></div></div>
        <div class="pickgroup"><div class="glabel">Vegetables</div><div class="pills" id="pk-veg"></div></div>
        <div class="pickgroup"><div class="glabel">Restaurants she goes to</div><div class="pills" id="pk-rest"></div></div>
        <div><button class="btn" type="button" id="btn-build">Build the system</button>
          <span class="hint" style="margin-left:10px">Rebuilds instantly. Nothing is sent anywhere.</span></div>
      </div>
    </details>
  </section>

  <main class="doc" id="doc"></main>
</div>

<script src="../restaurant-data.js?v=1"></script>
<script src="../recipe-data.js?v=1"></script>
<script src="../nutrition-engine.js?v=19"></script>
<script>
/* ======================= INPUTS ======================= */
var LS_KEY = 'lp_system_inputs';
var EXAMPLE = {name:'Rachel', cal:1800, pro:150, carbG:160, fatG:60, phase:'Lean', freq:'3', shake:30, style:'', allergies:[],
  protein:['chicken breast','salmon','nonfat Greek yogurt','whole eggs'], carb:['white rice','oats','berries','sweet potato'],
  fat:['avocado','almonds'], veg:['broccoli','spinach','peppers'], restaurants:["Chick-fil-A","Chipotle","Panera Bread"], example:true};

function decodeHash(){
  var m = location.hash.match(/[#&]d=([^&]+)/);
  if (!m) return null;
  try { return JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(m[1]))))); } catch(e){ return null; }
}
function loadInputs(){
  var h = decodeHash(); if (h) return h;
  try { var s = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); if (s) return s; } catch(e){}
  return EXAMPLE;
}
var IN = loadInputs();
if (IN.carbG == null && typeof IN.carb === 'number') { IN.carbG = IN.carb; IN.carb = []; }   // older links
if (IN.fatG == null && typeof IN.fat === 'number') { IN.fatG = IN.fat; IN.fat = []; }

/* ======================= HELPERS ======================= */
var $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function cap(s){ s = String(s||''); return s.charAt(0).toUpperCase() + s.slice(1); }
function fmtDate(){ return new Date().toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'}); }
function firstName(){ return (IN.name||'').trim().split(' ')[0] || 'Your'; }
function owner(){ var f = firstName(); return f === 'Your' ? 'Your' : f + "'s"; }
function foot(n){ return '<div class="sheet-foot"><span>Legacy Performance · Complete Nutrition System</span><span>' + esc(owner()) + ' system · ' + n + '</span></div>'; }
function macros(o){ return '<div class="macros"><span><b>' + Math.round(o.cal) + '</b> cal</span><span><b>' + Math.round(o.protein) + 'g</b> protein</span>' +
  (o.carbs != null ? '<span><b>' + Math.round(o.carbs) + 'g</b> carbs</span>' : '') + (o.fat != null ? '<span><b>' + Math.round(o.fat) + 'g</b> fat</span>' : '') + '</div>'; }

/* ======================= BUILD ======================= */
function build(){
  var it = {pfs:{calories:+IN.cal, protein:+IN.pro, carbs:+IN.carbG, fat:+IN.fatG}};
  var sel = {protein:IN.protein||[], carb:IN.carb||[], fat:IN.fat||[], veg:IN.veg||[], style:IN.style||'', allergies:IN.allergies||[],
             frequency:IN.freq||'3', shakeGrams:+IN.shake||30};
  var deck = generateMealOptions(it, sel, IN.name||'');
  var shop = [0,1,2].map(function(o){ return shoppingList(deck, {option:o, days:PLAN_ROTATION[o].count}); });
  var prep = [0,1].map(function(o){ return prepGuide(deck, {option:o, days:3}); });
  var produce = (typeof produceTarget === 'function') ? produceTarget(+IN.cal, IN.phase === 'Reverse Diet' ? 'Reverse Diet' : IN.phase) : null;
  var lunch = deck.slots.filter(function(s){ return s.name === 'Lunch'; })[0] || deck.slots[0];
  var lunchCal = lunch.target.protein*4 + lunch.target.carbs*4 + lunch.target.fat*9;
  var perMeal = mealSplit(it.pfs, sel.frequency, sel.shakeGrams).perMeal;
  var doc = [];

  /* 1. cover */
  doc.push('<section class="sheet cover"><img class="mark" src="../shield-white-gold.png" alt="">' +
    '<img class="logo" src="../logo-white-gold.png" alt="Legacy Performance">' +
    (IN.example ? '<p style="margin-top:18px"><span class="example no-print">Example system</span></p>' : '') +
    '<span class="eyebrow" style="margin-top:40px">' + esc(IN.phase || 'Lean') + ' phase</span>' +
    '<h1>' + esc(owner()) + '<br>Complete Nutrition <span class="gold">System</span></h1>' +
    '<p class="who">Built from your numbers and the food you actually eat. Yours for life.</p>' +
    '<div class="nums">' +
      '<div class="tile num"><b>' + (+IN.cal).toLocaleString() + '</b><span>Calories a day</span></div>' +
      '<div class="tile num"><b>' + IN.pro + 'g</b><span>Protein floor</span></div>' +
      '<div class="tile num"><b>' + IN.carbG + 'g</b><span>Carbs</span></div>' +
      '<div class="tile num"><b>' + IN.fatG + 'g</b><span>Fat</span></div>' +
      (produce ? '<div class="tile num"><b>' + produce + 'g</b><span>Fruit and veg</span></div>' : '') +
    '</div>' +
    '<p class="meta">' + esc(deck.label) + ' · Built ' + fmtDate() + ' · Rebuild it any time from your dashboard.</p>' +
    '</section>');

  /* 2. how it works */
  var rot = PLAN_ROTATION.map(function(r){ return '<tr><td><b>' + r.label + '</b></td><td>' + r.days + '</td><td>Option ' + (r.option+1) + ' of every meal</td></tr>'; }).join('');
  doc.push('<section class="sheet"><span class="label">How your system works</span><h2>Simple on <span class="gold">purpose.</span></h2>' +
    '<p class="intro">You do not have to count anything. The numbers are already inside the meals. Your job is to eat the portions, check in weekly, and rebuild when life changes.</p>' +
    '<div class="principles">' +
      '<div class="tile pr"><b>Protein on autopilot</b><p>Every meal is built around your protein, about ' + perMeal.protein + 'g a meal, so you hit ' + IN.pro + 'g without thinking about it.</p></div>' +
      '<div class="tile pr"><b>Nourishment made simple</b><p>' + (produce ? 'Eat about ' + produce + 'g of fruit and vegetables a day. ' : '') + 'That covers your fiber and micronutrients. Vegetables are unlimited.</p></div>' +
      '<div class="tile pr"><b>Carbs and fats, done for you</b><p>Every option is already balanced. All you do is stick to the portions.</p></div>' +
      '<div class="tile pr"><b>Swap anything, any time</b><p>Every option in a meal hits the same numbers, so any option works on any day. Use the swap guide for single foods.</p></div>' +
    '</div>' +
    '<h3 style="margin:24px 0 8px;font-size:.95rem">Your rhythm: batch cook three days at a time</h3>' +
    '<div class="tablewrap"><table><thead><tr><th>Batch</th><th>When</th><th>What you eat</th></tr></thead><tbody>' + rot + '</tbody></table></div>' +
    '<p class="note">Cooked food keeps 3 to 4 days in the fridge, so every batch covers 3 days. Day 7 is a good day for a free meal.</p>' +
    foot(2) + '</section>');

  /* 3. meals */
  var slotsHTML = deck.slots.map(function(sl){
    var opts = sl.options.map(function(o, i){
      return '<div class="tile opt"><span class="on">Option ' + (i+1) + '</span>' + (o.name ? '<h4 class="mname">' + esc(o.name) + '</h4>' : '') + '<ul>' + o.items.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>' + macros(o) + '</div>';
    }).join('');
    return '<div class="slot"><div class="slot-h"><h3>' + esc(sl.name) + '</h3><span>every option ≈ ' + (sl.target.protein||0) + 'g protein</span></div><div class="opts">' + opts + '</div></div>';
  }).join('');
  var snacks = (deck.companions||[]).map(function(c){
    return '<div class="tile opt"><span class="on">' + esc(c.name) + '</span><ul>' + c.items.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>' + macros(c) + '</div>';
  }).join('');
  doc.push('<section class="sheet"><span class="label">Your meals</span><h2>Meal plans for <span class="gold">every goal.</span></h2>' +
    '<p class="intro">Three options for every meal. Each option in a meal hits the same numbers, so swap freely.</p>' + slotsHTML +
    (snacks ? '<div class="slot"><div class="slot-h"><h3>Snacks and protein boosters</h3><span>for the days you come up short</span></div><div class="opts">' + snacks + '</div></div>' : '') +
    foot(3) + '</section>');

  /* 4. shopping lists */
  shop.forEach(function(sh, idx){
    var secs = sh.sections.map(function(sec){
      return '<div class="tile shopsec"><h3>' + esc(sec.name) + '</h3>' + sec.items.map(function(i){
        return '<div class="shopitem"><div class="box"></div><div><b>' + esc(cap(i.name)) + '</b><span>' + esc(i.need) + (i.buy ? ' · ' + (/^(one |from )/.test(i.buy) ? '' : 'buy ') + esc(i.buy) : '') + '</span></div></div>';
      }).join('') + '</div>';
    }).join('');
    doc.push('<section class="sheet"><span class="label">Shopping list · ' + esc(sh.label) + '</span><h2>' + esc(PLAN_ROTATION[idx].days) + ', <span class="gold">in one trip.</span></h2>' +
      '<p class="intro">Everything for ' + (sh.days === 1 ? 'day 7' : 'these ' + sh.days + ' days') + ', including one snack a day. Check it off as you shop.</p>' +
      '<div class="shopcols">' + secs + '</div><p class="note">' + esc(sh.note) + '</p>' + foot(4 + idx) + '</section>');
  });

  /* 5. prep guides */
  prep.forEach(function(pg, idx){
    var steps = pg.steps.map(function(st){ return '<div class="tile step"><h3>' + esc(st.title) + '</h3><ul>' + st.lines.map(function(l){ return '<li>' + esc(l) + '</li>'; }).join('') + '</ul></div>'; }).join('');
    doc.push('<section class="sheet"><span class="label">Meal prep guide · ' + esc(pg.label) + '</span><h2>Cook once. <span class="gold">Eat for three days.</span></h2>' +
      '<p class="intro">About an hour on prep day. Start the oven first, then work through the steps in order.</p>' +
      '<div class="steps">' + steps + '</div>' +
      '<div class="panel storage"><b>Storage.</b> ' + pg.storage.map(esc).join(' ') + '</div>' +
      '<p class="note">' + esc(pg.source) + '</p>' + foot(7 + idx) + '</section>');
  });

  /* 6. swap guide */
  var ch = swapChart(perMeal, {style:sel.style, allergies:sel.allergies});
  function col(title, c, what){ return '<div class="tile swapcol"><h3>' + title + '</h3><span class="sub">any one = ' + what + '</span><ul>' +
    c.items.slice(0,14).map(function(x){ return '<li>' + esc(x.qty) + '<span>' + x.kcal + ' cal</span></li>'; }).join('') + '</ul></div>'; }
  doc.push('<section class="sheet"><span class="label">Swap guide</span><h2>Tired of a food? <span class="gold">Trade it.</span></h2>' +
    '<p class="intro">Each column is one meal\'s worth. Swap protein for protein, carbs for carbs, fat for fat, and the meal still hits your numbers.</p>' +
    '<div class="swapgrid">' + col('Protein', ch.protein, ch.protein.grams + 'g protein') + col('Carbs', ch.carb, ch.carb.grams + 'g carbs') + col('Added fat', ch.fat, ch.fat.grams + 'g fat') + '</div>' +
    '<p class="note">Vegetables stay unlimited. Every portion comes from USDA data or the brand label.</p>' + foot(9) + '</section>');

  /* 7. restaurants */
  var rests = (IN.restaurants||[]).map(function(name){
    var r = restaurantMeals(name, {calories:lunchCal, protein:lunch.target.protein}, {count:2});
    if (r.empty) return '';
    return '<div class="tile rest"><h3>' + esc(name) + '</h3>' + r.options.map(function(o){
      return '<p class="order">' + esc(o.title) + '</p><p class="fit">' + o.totals.kcal + ' cal · ' + o.totals.p + 'g protein</p>'; }).join('') +
      (r.official ? '' : '<p class="note">From the nutrition board posted in store.</p>') + '</div>';
  }).join('');
  doc.push('<section class="sheet"><span class="label">Eating out</span><h2>No more guessing at <span class="gold">restaurants.</span></h2>' +
    '<p class="intro">Real orders, sized to one of your meals (about ' + Math.round(lunchCal) + ' calories and ' + lunch.target.protein + 'g protein), from each restaurant\'s own published nutrition.</p>' +
    (rests || '<p class="note">No restaurants picked yet. Add the places you go and rebuild.</p>') +
    '<h3 style="margin:20px 0 8px;font-size:.95rem">The rules that work anywhere</h3><ul class="rules">' +
    RESTAURANT_RULES.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>' + foot(10) + '</section>');

  /* 8. next steps */
  doc.push('<section class="sheet"><span class="label">From here</span><h2>Your system <span class="gold">keeps up with you.</span></h2>' +
    '<div class="principles">' +
      '<div class="tile pr"><b>Check in every week</b><p>The more you check in, the smarter the LP Coach gets, and the more guidance you get on your progress.</p></div>' +
      '<div class="tile pr"><b>Rebuild any time</b><p>New goal, new phase, tired of your meals? Open your dashboard and build a new plan. Download it again whenever you like.</p></div>' +
      '<div class="tile pr"><b>Stick to the portions</b><p>The numbers are already inside the meals. Consistency with the portions beats perfection every time.</p></div>' +
      '<div class="tile pr"><b>We perfect it together</b><p>Your first 30 days are the tuning period. If something is not working, we adjust it.</p></div>' +
    '</div>' +
    '<p class="note" style="margin-top:22px">Educational coaching guidance, not medical advice. Individual results vary. Consult your physician before changing your diet, especially with a medical condition.</p>' +
    foot(11) + '</section>');

  $('doc').innerHTML = doc.join('');
  $('status').innerHTML = IN.example
    ? '<b>Example system.</b> Open the builder below to enter a member\'s numbers and foods.'
    : '<b>' + esc(owner()) + ' system</b> · ' + (+IN.cal).toLocaleString() + ' calories · ' + IN.pro + 'g protein · ' + esc(deck.label);
  document.title = (IN.example ? '' : owner() + ' ') + 'Complete Nutrition System | Legacy Performance';
}

/* ======================= BUILDER UI ======================= */
var PICKS = {protein:[], carb:[], fat:[], veg:[], allergies:[], restaurants:[]};
function pills(el, list, key, labelFn){
  $(el).innerHTML = list.map(function(v){
    var on = (IN[key]||[]).indexOf(v) >= 0;
    return '<button type="button" class="pill' + (on ? ' on' : '') + '" data-k="' + key + '" data-v="' + esc(v) + '" aria-pressed="' + on + '">' + esc(labelFn ? labelFn(v) : v) + '</button>';
  }).join('');
}
function fillBuilder(){
  $('in-name').value = IN.name || ''; $('in-cal').value = IN.cal || ''; $('in-pro').value = IN.pro || '';
  $('in-carb').value = IN.carbG || ''; $('in-fat').value = IN.fatG || ''; $('in-phase').value = IN.phase || 'Lean';
  $('in-freq').value = IN.freq || '3'; $('in-style').value = IN.style || '';
  pills('pk-protein', FOOD_DB.protein.map(function(f){ return f.n; }), 'protein');
  pills('pk-carb', FOOD_DB.carb.map(function(f){ return f.n; }), 'carb');
  pills('pk-fat', FOOD_DB.fat.map(function(f){ return f.n; }), 'fat');
  pills('pk-veg', FOOD_DB.veg, 'veg');
  pills('pk-allergies', ['dairy','egg','fish','shellfish','soy','gluten','nut','peanut','sesame'], 'allergies', cap);
  pills('pk-rest', restaurantChains(), 'restaurants');
}
document.addEventListener('click', function(e){
  var p = e.target.closest('.pill'); if (!p) return;
  var k = p.dataset.k, v = p.dataset.v, arr = (IN[k] = (IN[k]||[]).slice()), i = arr.indexOf(v);
  if (i >= 0) arr.splice(i, 1); else arr.push(v);
  p.classList.toggle('on', i < 0); p.setAttribute('aria-pressed', String(i < 0));
});
$('btn-build').addEventListener('click', function(){
  IN.name = $('in-name').value.trim(); IN.cal = +$('in-cal').value; IN.pro = +$('in-pro').value;
  IN.carbG = +$('in-carb').value; IN.fatG = +$('in-fat').value; IN.phase = $('in-phase').value;
  IN.freq = $('in-freq').value; IN.style = $('in-style').value; IN.example = false;
  if (!(IN.cal > 0 && IN.pro > 0 && IN.carbG > 0 && IN.fatG > 0)){ $('status').innerHTML = '<b>Add calories, protein, carbs and fat</b> to build the system.'; return; }
  try { localStorage.setItem(LS_KEY, JSON.stringify(IN)); } catch(e){}
  build(); window.scrollTo({top: $('doc').offsetTop - 10, behavior:'smooth'});
});
$('btn-edit').addEventListener('click', function(){ var b = $('builder'); b.open = true; b.scrollIntoView({behavior:'smooth'}); });
$('btn-pdf').addEventListener('click', function(){ window.print(); });

fillBuilder();
build();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<!-- Legacy OS — the INSTALL WALL. Mobile-first, Legacy Dark.
     Placed after the Starting Point (peak buy-in): the member has their numbers/phase/Legacy Score,
     so "put your system on your home screen" reads as a benefit. Blocks continuing until the app is
     opened from the home screen (standalone mode) — which is also what unlocks web push on iOS 16.4+.
     Detection is client-side; instructions differ iOS vs Android. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#141310">
<title>Add to Home Screen | Legacy OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<style>
:root{--ink:#141310;--olive:#4A5C3E;--olive-lt:#8FA97A;--olive-dim:rgba(143,169,122,.22);--parch:#F2EDE4;--gold:#C1AD72;--gold-dim:rgba(193,173,114,.3);--soft:#a49d90;--body:#d9d3c8;--field:rgba(255,255,255,.05);--field-line:rgba(242,237,228,.14)}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--ink)}
body{min-height:100vh;font-family:Montserrat,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--parch);-webkit-font-smoothing:antialiased;line-height:1.5;overflow-x:hidden;
  background:radial-gradient(ellipse 70% 40% at 50% 6%, rgba(193,173,114,.11), transparent 60%),radial-gradient(ellipse 105% 60% at 0% 100%, rgba(74,92,62,.6), transparent 74%),linear-gradient(180deg,#1a1813 0%,#141510 55%,#0f1310 100%);background-attachment:fixed}
.wrap{position:relative;z-index:1;max-width:440px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:calc(44px + env(safe-area-inset-top)) 26px calc(30px + env(safe-area-inset-bottom))}
.markwrap{position:relative;display:grid;place-items:center;margin-bottom:22px}
.markwrap:before{content:"";position:absolute;width:190px;height:190px;border-radius:50%;background:radial-gradient(circle, rgba(193,173,114,.3), transparent 68%);filter:blur(4px)}
.markwrap img{position:relative;width:96px;filter:drop-shadow(0 6px 22px rgba(193,173,114,.4))}
.eyebrow{font-size:.72rem;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);font-weight:700}
h1{font-weight:900;letter-spacing:-.01em;line-height:1.02;text-transform:uppercase;margin-top:12px}
h1 .l1{display:block;font-size:clamp(2.0rem,9.6vw,2.5rem)}
h1 .l2{display:block;font-size:clamp(3.0rem,15vw,3.8rem);color:var(--gold);line-height:.96}
.lead{margin-top:16px;font-size:.98rem;color:var(--body);max-width:380px;line-height:1.6}
.steps{margin-top:26px;width:100%;background:linear-gradient(180deg,rgba(84,106,70,.1),rgba(255,255,255,.028));border:1px solid var(--olive-dim);border-radius:18px;padding:20px 18px;text-align:left}
.step{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:start;padding:11px 0;border-bottom:1px solid var(--field-line)}
.step:last-child{border-bottom:none}
.step .n{width:30px;height:30px;border-radius:8px;background:rgba(193,173,114,.16);display:grid;place-items:center;color:var(--gold);font-family:Cinzel,serif;font-weight:700;font-size:1rem}
.step p{font-size:.9rem;color:var(--body);line-height:1.5}
.step b{color:#fff}
.plat{display:flex;gap:8px;margin-top:18px;width:100%}
.ptab{flex:1;background:rgba(255,255,255,.04);border:1px solid var(--field-line);color:var(--body);font-family:inherit;font-weight:800;font-size:.82rem;padding:10px;border-radius:11px;cursor:pointer}
.ptab.on{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.cta{display:block;width:100%;max-width:340px;margin-top:22px;background:var(--gold);color:var(--ink);font-weight:800;font-size:1rem;letter-spacing:.03em;padding:16px;border-radius:13px;border:none;cursor:pointer;font-family:inherit;box-shadow:0 10px 30px rgba(193,173,114,.28)}
.cta.disabled{opacity:.4;pointer-events:none;box-shadow:none}
.recheck{margin-top:14px;background:none;border:none;color:var(--gold);font-family:inherit;font-size:.84rem;font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.ok{margin-top:26px;width:100%;background:linear-gradient(90deg,rgba(84,106,70,.24),rgba(255,255,255,.035));border:1px solid var(--olive-dim);border-radius:16px;padding:20px}
.ok .big{font-family:Cinzel,serif;font-size:1.4rem;color:var(--gold);font-weight:700}
.ok p{font-size:.9rem;color:var(--body);margin-top:6px}
.why{margin-top:16px;font-size:.78rem;color:var(--soft);max-width:360px;line-height:1.55}
</style>
</head>
<body>
<main class="wrap" id="wrap"></main>
<script>
function isStandalone(){ try{ return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone===true; }catch(e){ return false; } }
function isIOS(){ return /iphone|ipad|ipod/i.test(navigator.userAgent||''); }
var NEXT='book.html';                        // where they go once installed (their next onboarding step)
var deferredPrompt=null;
window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); deferredPrompt=e; render(); });
var PLAT = isIOS() ? 'ios' : 'android';
function setPlat(p){ PLAT=p; render(); }
function androidInstall(){ if(deferredPrompt){ deferredPrompt.prompt(); deferredPrompt.userChoice.then(function(){ deferredPrompt=null; setTimeout(render,600); }); } }
function proceed(){ location.href=NEXT; }
function render(){
  var w=document.getElementById('wrap');
  if(isStandalone()){
    w.innerHTML='<div class="markwrap"><img src="../shield-white-gold.png" alt=""></div>'
      +'<div class="eyebrow">You\'re set</div>'
      +'<h1><span class="l1">On your</span><span class="l2">home screen</span></h1>'
      +'<div class="ok"><div class="big">Nice. Your OS is installed.</div><p>One tap from your home screen, every day. This is how it should feel.</p></div>'
      +'<button class="cta" onclick="proceed()">Continue →</button>';
    return;
  }
  var iosSteps='<div class="step"><div class="n">1</div><p>Tap the <b>Share</b> button (the square with an arrow) at the bottom of Safari.</p></div>'
    +'<div class="step"><div class="n">2</div><p>Scroll and tap <b>Add to Home Screen</b>.</p></div>'
    +'<div class="step"><div class="n">3</div><p>Tap <b>Add</b>, then open the <b>Legacy</b> icon from your home screen.</p></div>';
  var andSteps=(deferredPrompt
      ? '<div class="step"><div class="n">1</div><p>Tap <b>Install app</b> below and confirm.</p></div><div class="step"><div class="n">2</div><p>Open <b>Legacy</b> from your home screen.</p></div>'
      : '<div class="step"><div class="n">1</div><p>Tap the <b>⋮</b> menu (top right of Chrome).</p></div><div class="step"><div class="n">2</div><p>Tap <b>Install app</b> (or <b>Add to Home screen</b>).</p></div><div class="step"><div class="n">3</div><p>Open <b>Legacy</b> from your home screen.</p></div>');
  var steps = PLAT==='ios' ? iosSteps : andSteps;
  var androidBtn = (PLAT==='android' && deferredPrompt) ? '<button class="cta" onclick="androidInstall()">Install app</button>' : '';
  w.innerHTML='<div class="markwrap"><img src="../shield-white-gold.png" alt=""></div>'
    +'<div class="eyebrow">One last thing</div>'
    +'<h1><span class="l1">Make it</span><span class="l2">yours</span></h1>'
    +'<p class="lead">Your plan is built. Put your OS on your home screen so it is one tap away, every day, and you never lose your place.</p>'
    +'<div class="plat"><button class="ptab'+(PLAT==='ios'?' on':'')+'" onclick="setPlat(\'ios\')">iPhone</button><button class="ptab'+(PLAT==='android'?' on':'')+'" onclick="setPlat(\'android\')">Android</button></div>'
    +'<div class="steps">'+steps+'</div>'
    + androidBtn
    +'<button class="recheck" onclick="render()">I\'ve added it — check again</button>'
    +'<p class="why">This is your app now. Adding it also lets us send you reminders, so you stay on track between check-ins.</p>';
}
render();
window.addEventListener('visibilitychange', function(){ if(!document.hidden) render(); });
</script>
</body>
</html>

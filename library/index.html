<!DOCTYPE html>
<html lang="en">
<head>
<!-- LP Resource Library — prototype. Mobile-first, Legacy Dark.
     Kinobody-style: a branded front door of cards that LINK OUT to where each file lives
     (YouTube for video, PDFs in the repo/Drive, Google Sheets for templates). The OS is the
     shelf; the files live cheaply behind the links. Sample content below. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#141310">
<title>Library | Legacy OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<style>
:root{--ink:#141310;--olive:#4A5C3E;--olive-lt:#8FA97A;--olive-dim:rgba(143,169,122,.22);--parch:#F2EDE4;--gold:#C1AD72;--gold-dim:rgba(193,173,114,.3);--soft:#a49d90;--body:#d9d3c8;--field:rgba(255,255,255,.05);--field-line:rgba(242,237,228,.14)}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--ink)}
body{min-height:100vh;font-family:Montserrat,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--parch);
  -webkit-font-smoothing:antialiased;line-height:1.5;overflow-x:hidden;
  background:radial-gradient(ellipse 70% 34% at 50% 2%, rgba(193,173,114,.09), transparent 60%),
    radial-gradient(ellipse 105% 50% at 0% 100%, rgba(74,92,62,.5), transparent 74%),
    linear-gradient(180deg,#1a1813 0%,#141510 55%,#0f1310 100%);background-attachment:fixed}
.wrap{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:calc(22px + env(safe-area-inset-top)) 18px calc(40px + env(safe-area-inset-bottom))}

.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.top img{height:30px;width:auto;margin-left:-4px}
.done{background:transparent;border:1px solid var(--field-line);color:var(--parch);font-family:inherit;font-weight:700;font-size:.82rem;padding:9px 14px;border-radius:11px;cursor:pointer}

.eyebrow{margin-top:22px;font-size:.7rem;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);font-weight:700}
.h-lib{font-weight:900;letter-spacing:-.01em;line-height:1.0;text-transform:uppercase;margin-top:10px}
.h-lib span{display:block}
.h-lib .l1{font-size:clamp(2.3rem,11.6vw,3.0rem)}
.h-lib .l2{font-size:clamp(2.3rem,11.6vw,3.0rem);color:var(--gold);line-height:1.0;margin-top:1px}
.sub{margin-top:12px;font-size:.92rem;color:var(--soft)}

/* filter chips */
.filters{display:flex;gap:8px;overflow-x:auto;margin-top:20px;padding-bottom:4px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fchip{flex:0 0 auto;background:rgba(255,255,255,.04);border:1px solid var(--field-line);color:var(--body);font-family:inherit;font-weight:700;font-size:.8rem;padding:9px 15px;border-radius:99px;cursor:pointer;transition:all .15s}
.fchip.on{background:var(--gold);color:var(--ink);border-color:var(--gold)}

/* grid */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.card{display:flex;flex-direction:column;background:rgba(255,255,255,.025);border:1px solid var(--field-line);border-radius:16px;padding:15px 15px 14px;text-decoration:none;color:inherit;transition:border-color .15s,transform .15s;min-height:150px}
.card:hover{border-color:var(--gold);transform:translateY(-2px)}
.card .ic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-size:1.15rem;margin-bottom:11px}
.card.video .ic{background:rgba(193,173,114,.16);color:var(--gold)}
.card.guide .ic{background:rgba(143,169,122,.16);color:var(--olive-lt)}
.card.template .ic{background:rgba(242,237,228,.1);color:var(--parch)}
.badge{font-size:.56rem;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--soft)}
.card h3{font-size:.98rem;font-weight:800;color:#fff;margin-top:5px;line-height:1.25}
.card p{font-size:.78rem;color:var(--soft);margin-top:5px;line-height:1.45;flex:1}
.card .open{font-size:.76rem;font-weight:800;color:var(--gold);margin-top:10px}
.empty{grid-column:1/-1;color:var(--soft);text-align:center;padding:30px 0;font-size:.9rem}
@media(max-width:400px){.grid{grid-template-columns:1fr}.card{min-height:0}}
</style>
</head>
<body>
<main class="wrap">
  <div class="top">
    <img src="../logo-white-gold.png" alt="Legacy Performance">
    <button class="done" onclick="location.href='../client.html'">Done</button>
  </div>

  <div class="eyebrow">The Legacy OS</div>
  <h1 class="h-lib"><span class="l1">Resource</span><span class="l2">library</span></h1>
  <p class="sub">Everything you need, in one place. Tap any resource to open it.</p>

  <div class="filters" id="filters"></div>
  <div class="grid" id="grid"></div>
</main>

<script>
function yt(q){ return 'https://www.youtube.com/results?search_query='+encodeURIComponent(q); }
/* Each item just LINKS OUT to wherever the file lives. Add a resource = add a line here (or, later,
   pull from a simple list a VA can edit). Nothing is hosted in the app itself. */
var ICON={video:'▶', guide:'📖', template:'▦'};
var RES=[
  {type:'video', title:'How to Track Your Food', desc:'The 5-minute Cronometer walkthrough.', url:yt('how to track food cronometer')},
  {type:'video', title:'The Reverse Diet, Explained', desc:'Why eating more comes first.', url:yt('reverse diet explained')},
  {type:'video', title:'Grocery Shopping the LP Way', desc:'Build your cart around protein.', url:yt('high protein grocery shopping')},
  {type:'video', title:'How to Read Your Numbers', desc:'Calories, protein, steps, phase.', url:'#'},
  {type:'guide', title:'The Awareness Circle', desc:'The whole method: read your loop, run your body.', url:'../awareness-circle/'},
  {type:'guide', title:'The Season Cycle', desc:'The map with no finish line: when to lose, build, hold.', url:'../season-cycle/'},
  {type:'guide', title:'The Macro Freedom Framework', desc:'Free meals without wrecking progress.', url:'../macro-freedom/'},
  {type:'guide', title:'The Scale Standard', desc:'A tool, not a verdict. Read the trend, not the day.', url:'../scale-standard/'},
  {type:'guide', title:'The Power Food List', desc:'106 real foods, ranked into tiers. Build any plate.', url:'../power-food-list/'},
  {type:'guide', title:'Foundations: First 6 Weeks', desc:'The skills that make it stick.', url:'#'},
  {type:'guide', title:'Eating Out Playbook', desc:'Order right at 48 chains.', url:'#'},
  {type:'template', title:'Meal Planning Sheet', desc:'A Google Sheet you copy and fill in.', url:'#'},
  {type:'template', title:'Weekly Check-in Template', desc:'What to send your coach each week.', url:'#'}
];
var FILTERS=[['all','All'],['video','Videos'],['guide','Guides'],['template','Templates']];
var active='all';
function renderFilters(){
  document.getElementById('filters').innerHTML=FILTERS.map(function(f){
    return '<button class="fchip'+(f[0]===active?' on':'')+'" onclick="setFilter(\''+f[0]+'\')">'+f[1]+'</button>';
  }).join('');
}
function setFilter(f){ active=f; renderFilters(); renderGrid(); }
function renderGrid(){
  var items=RES.filter(function(r){ return active==='all'||r.type===active; });
  var g=document.getElementById('grid');
  if(!items.length){ g.innerHTML='<div class="empty">Nothing here yet.</div>'; return; }
  g.innerHTML=items.map(function(r){
    return '<a class="card '+r.type+'" href="'+r.url+'" target="_blank" rel="noopener">'
      +'<div class="ic">'+ICON[r.type]+'</div>'
      +'<div class="badge">'+(r.type==='template'?'Template':r.type==='guide'?'Guide':'Video')+'</div>'
      +'<h3>'+r.title+'</h3><p>'+r.desc+'</p>'
      +'<div class="open">Open →</div></a>';
  }).join('');
}
renderFilters(); renderGrid();
</script>
</body>
</html>

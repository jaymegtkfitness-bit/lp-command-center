<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1C1C1C" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Jayme's EA" />
<meta name="robots" content="noindex, nofollow" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<title>Jayme&rsquo;s Assistant</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{
  --charcoal:#1C1C1C; --olive:#4A5C3E; --olive-soft:#7c9268;
  --parchment:#F2EDE4; --gold:#C1AD72;
  --bg:#141414; --card:#1e1e1e; --line:#2e2e2e; --text:#e8e3d9; --dim:#9a948a;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:'Montserrat',system-ui,-apple-system,sans-serif;
  min-height:100dvh; display:flex; flex-direction:column; align-items:center;
  padding:24px 18px calc(24px + env(safe-area-inset-bottom));
}
.wrap{width:100%; max-width:460px}
header{text-align:center; margin-bottom:22px}
header img{width:132px; height:auto; display:block; margin:0 auto 14px}
header h1{font-family:'Cinzel',serif; font-size:20px; font-weight:600; color:var(--parchment); margin:0 0 5px; letter-spacing:.3px}
header p{margin:0; font-size:13.5px; color:var(--dim); line-height:1.5}

.seg{display:flex; gap:8px; margin-bottom:14px}
.seg button{
  flex:1; padding:13px 8px; border-radius:11px; border:1px solid var(--line);
  background:var(--card); color:var(--dim); font-family:inherit; font-size:14px; font-weight:600;
  cursor:pointer; transition:.15s;
}
.seg button[aria-pressed="true"]{background:var(--olive); border-color:var(--olive-soft); color:#fff}

label{display:block; font-size:12px; font-weight:600; color:var(--dim); margin:0 0 6px; letter-spacing:.4px; text-transform:uppercase}
textarea, input{
  width:100%; background:var(--card); border:1px solid var(--line); border-radius:11px;
  color:var(--text); font-family:inherit; font-size:16px; padding:14px; outline:none;
}
textarea{min-height:118px; resize:vertical; line-height:1.5}
textarea:focus, input:focus{border-color:var(--olive-soft)}
input[type="datetime-local"]{color-scheme:dark}
.field{margin-bottom:14px}
.hint{font-size:12.5px; color:var(--dim); margin:7px 2px 0; line-height:1.45}

.go{
  width:100%; padding:16px; border:0; border-radius:12px; background:var(--gold); color:#1C1C1C;
  font-family:inherit; font-size:16px; font-weight:700; cursor:pointer; letter-spacing:.3px;
}
.go:disabled{opacity:.5; cursor:default}

.toast{
  margin-top:16px; padding:14px 16px; border-radius:11px; font-size:14px; line-height:1.5;
  border:1px solid var(--olive-soft); background:rgba(74,92,62,.22); color:var(--parchment); display:none;
}
.toast.show{display:block}
.toast.err{border-color:#7d4a4a; background:rgba(125,74,74,.22)}
footer{margin-top:22px; text-align:center; font-size:11.5px; color:#6e6a63; line-height:1.6}
footer a{color:#6e6a63; text-decoration:underline; cursor:pointer}
.hidden{display:none}
</style>
</head>

      <button type="button" id="bTask" aria-pressed="true">Add a task</button>
      <button type="button" id="bCal"  aria-pressed="false">Calendar</button>
    </div>

    <div class="field">
      <label for="msg" id="msgLabel">What&rsquo;s the task?</label>
      <textarea id="msg" placeholder="Pick up Ellie from practice&hellip;"></textarea>
    </div>

    <div class="field hidden" id="whenWrap">
      <label for="when">When</label>
      <input type="datetime-local" id="when" />
      <p class="hint">Goes straight on his calendar &mdash; he doesn&rsquo;t have to approve it.</p>
    </div>

    <button class="go" id="go">Send it</button>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>

  <footer>
    Legacy Performance &middot; goes to Jayme only
    <span id="resetWrap" class="hidden"><br /><a id="reset">forget passphrase on this phone</a></span>
  </footer>
</div>

<script>
/* =================== CONFIG =================== */
/* Same Apps Script doorway the Command Center uses. */
var WRITE_URL = "https://script.google.com/macros/s/AKfycbzawUtTobA9Jfne8Hot7K7AIgnMp4izfYUo773nSKOZN4Z5xFNf3d9hDY6B-FMGdgV-/exec";

/* Identity is baked into the PAGE, not typed by the sender and not inferred from a phone number.
   The EA authorizes on this value. Scoped to task + calendar only. */
var FROM = "wife";

/* The passphrase is NOT in this file. It lives in the doorway's Script Properties (server-side)
   and in this phone's localStorage after first unlock. That is the whole point: this repo is
   public, so anything written here would be readable by anyone. Without a valid key the doorway
   still CAPTURES what's sent (nothing is silently dropped) but will not auto-create anything. */
var KEY_STORE = "lp_ea_key";
/* ============================================== */

var kind = "task";
function $(id){ return document.getElementById(id); }
function key(){ try{ return localStorage.getItem(KEY_STORE) || ""; }catch(e){ return ""; } }

/* JSONP — the doorway is an Apps Script, so a plain fetch can't read the response. */
function jsonp(params, cb){
  var name = "__ea" + Date.now(), s = document.createElement("script"), done = false;
  window[name] = function(d){ done = true; try{ delete window[name]; }catch(e){} s.remove(); cb(d); };
  s.onerror = function(){ if(!done){ done = true; s.remove(); cb(null); } };
  s.src = WRITE_URL + "?" + params + "&callback=" + name;
  document.body.appendChild(s);
  setTimeout(function(){ if(!done){ done = true; s.remove(); cb(null); } }, 12000);
}

function toast(el, text, isErr){
  var t = $(el);
  t.textContent = text;
  t.className = "toast show" + (isErr ? " err" : "");
}

/* ---------------- unlock ---------------- */
function showMain(){
  $("lockView").classList.add("hidden");
  $("mainView").classList.remove("hidden");
  $("resetWrap").classList.remove("hidden");
  $("sub").textContent = "Send it here and it won’t get lost.";
}

$("unlock").onclick = function(){
  var v = $("pass").value.trim();
  if(!v){ toast("lockToast", "Enter the passphrase.", true); return; }
  $("unlock").disabled = true; $("unlock").textContent = "Checking…";
  jsonp("action=eacheck&key=" + encodeURIComponent(v), function(d){
    $("unlock").disabled = false; $("unlock").textContent = "Unlock";
    if(d && d.ok){
      try{ localStorage.setItem(KEY_STORE, v); }catch(e){}
      $("pass").value = "";
      showMain();
    }else if(d){
      toast("lockToast", "That’s not it. Try again.", true);
    }else{
      toast("lockToast", "Couldn’t reach the assistant. Check your signal.", true);
    }
  });
};
$("pass").addEventListener("keydown", function(e){ if(e.key === "Enter") $("unlock").click(); });

$("reset").onclick = function(){
  try{ localStorage.removeItem(KEY_STORE); }catch(e){}
  location.reload();
};

/* ---------------- composer ---------------- */
function setKind(k){
  kind = k;
  $("bTask").setAttribute("aria-pressed", k === "task");
  $("bCal").setAttribute("aria-pressed",  k === "calendar");
  $("whenWrap").classList.toggle("hidden", k !== "calendar");
  $("msgLabel").textContent = (k === "calendar") ? "What is it?" : "What’s the task?";
  $("msg").placeholder = (k === "calendar")
    ? "Dinner with the Hendersons…"
    : "Pick up Ellie from practice…";
}
$("bTask").onclick = function(){ setKind("task"); };
$("bCal").onclick  = function(){ setKind("calendar"); };

$("go").onclick = function(){
  var message = $("msg").value.trim();
  if(!message){ toast("toast", "Type something first.", true); return; }

  /* A calendar item with no time can't be auto-created, and guessing a time is worse than
     asking. Say so rather than silently filing it as a task. */
  var when = "";
  if(kind === "calendar"){
    if(!$("when").value){ toast("toast", "Add a date and time so it can go on his calendar.", true); return; }
    when = new Date($("when").value).toISOString();
  }

  $("go").disabled = true; $("go").textContent = "Sending…";

  var payload = { type:"inbox", from:FROM, channel:"web", kind:kind, message:message, when:when, key:key() };

  /* no-cors: we can't read the response, but the write lands. Confirm optimistically —
     same pattern the Command Center uses. */
  fetch(WRITE_URL, {
    method:"POST", mode:"no-cors",
    headers:{ "Content-Type":"text/plain;charset=utf-8" },
    body: JSON.stringify(payload)
  }).then(function(){
    toast("toast", kind === "calendar" ? "On his calendar. ✓" : "Sent — it’s on his list. ✓", false);
    $("msg").value = ""; $("when").value = "";
  }).catch(function(){
    toast("toast", "Didn’t send — check your signal and try again.", true);
  }).then(function(){
    $("go").disabled = false; $("go").textContent = "Send it";
  });
};

setKind("task");
if(key()) showMain();
</script>
</body>
</html>

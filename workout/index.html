<!DOCTYPE html>
<html lang="en">
<head>
<!-- LP Workout Logger — prototype. Mobile-first, Legacy Dark.
     Chalk's structure (Blocks A-D, target reps, rest timer, video link, RPE note)
     + FitNotes' logging (weight/reps steppers, save, set list, last-time + PR).
     Static demo: sample LP Training System day. Data lives in localStorage only for now. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#141310">
<title>Workout | Legacy OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<style>
:root{--ink:#141310;--olive:#4A5C3E;--olive-lt:#8FA97A;--olive-dim:rgba(143,169,122,.22);--parch:#F2EDE4;--gold:#C1AD72;--gold-dim:rgba(193,173,114,.30);--soft:#a49d90;--body:#d9d3c8;--field:rgba(255,255,255,.05);--field-line:rgba(242,237,228,.14)}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--ink)}
body{min-height:100vh;font-family:Montserrat,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--parch);
  -webkit-font-smoothing:antialiased;line-height:1.5;overflow-x:hidden;
  background:radial-gradient(ellipse 70% 34% at 50% 2%, rgba(193,173,114,.09), transparent 60%),
    radial-gradient(ellipse 105% 50% at 0% 100%, rgba(74,92,62,.5), transparent 74%),
    linear-gradient(180deg,#1a1813 0%,#141510 55%,#0f1310 100%);background-attachment:fixed}

.wrap{position:relative;z-index:1;max-width:460px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) 18px calc(96px + env(safe-area-inset-bottom))}

/* header */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.top img{height:30px;width:auto;margin-left:-4px}
.eyebrow{margin-top:20px;font-size:.68rem;letter-spacing:.26em;text-transform:uppercase;color:var(--gold);font-weight:700}
h1{font-family:Montserrat;font-weight:900;font-size:2.1rem;letter-spacing:-.01em;text-transform:uppercase;line-height:1;margin-top:8px}
.sub{margin-top:8px;font-size:.9rem;color:var(--soft)}

/* rest timer bar */
.timer{position:sticky;top:8px;z-index:5;margin-top:16px;display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:linear-gradient(90deg,rgba(84,106,70,.22),rgba(20,19,16,.85));backdrop-filter:blur(8px);
  border:1px solid var(--olive-dim);border-radius:14px;padding:12px 14px}
.timer .tlab{font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;color:var(--soft);font-weight:700}
.timer .tval{font-family:Cinzel,serif;font-weight:700;font-size:1.5rem;color:#fff;font-variant-numeric:tabular-nums}
.timer .tval.gold{color:var(--gold)}
.timer .tcol{display:flex;flex-direction:column}
.timer .trow{display:flex;align-items:center;gap:12px}
.tbtn{background:var(--gold);color:var(--ink);border:none;border-radius:10px;font-family:inherit;font-weight:800;font-size:.78rem;padding:9px 13px;cursor:pointer;letter-spacing:.02em}
.tbtn.ghost{background:transparent;border:1px solid var(--field-line);color:var(--parch)}

/* exercise cards */
.ex{margin-top:12px;background:rgba(255,255,255,.02);border:1px solid var(--field-line);border-radius:16px;overflow:hidden}
.ex.done{border-color:var(--olive-dim)}
.ex-head{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding:15px 15px;cursor:pointer}
.blk{width:34px;height:34px;border-radius:9px;background:rgba(193,173,114,.16);display:grid;place-items:center;color:var(--gold);font-family:Cinzel,serif;font-weight:700;font-size:1.1rem}
.ex.done .blk{background:var(--olive);color:#fff}
.ex-name{font-size:1.02rem;font-weight:800;color:#fff}
.ex-meta{font-size:.8rem;color:var(--soft);margin-top:2px}
.ex-meta .last{color:var(--olive-lt)}
.chev{color:var(--soft);font-size:1.1rem;transition:transform .2s}
.ex.open .chev{transform:rotate(90deg)}
.ex-body{display:none;padding:0 15px 15px}
.ex.open .ex-body{display:block}
.note{background:rgba(193,173,114,.08);border-left:3px solid var(--gold);border-radius:0 10px 10px 0;padding:9px 12px;margin-bottom:12px;font-size:.82rem;color:var(--body);line-height:1.5}
.note b{color:var(--gold)}
.vid{display:inline-flex;align-items:center;gap:7px;font-size:.78rem;font-weight:700;color:var(--gold);text-decoration:none;margin-bottom:12px}
.detail{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.detail .d{background:rgba(255,255,255,.03);border:1px solid var(--field-line);border-radius:10px;padding:9px 11px}
.detail .d span{display:block;font-size:.55rem;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);font-weight:700;margin-bottom:2px}
.detail .d b{font-size:.9rem;color:#fff;font-weight:800}
.swap{margin-bottom:12px}
.swap summary{cursor:pointer;font-size:.78rem;font-weight:700;color:var(--gold);list-style:none;padding:2px 0}
.swap summary::-webkit-details-marker{display:none}
.swap .subs{margin-top:8px;display:grid;gap:6px}
.swap .sub{display:block;width:100%;text-align:left;background:rgba(255,255,255,.03);border:1px solid var(--field-line);border-radius:10px;padding:12px 12px;font-size:.86rem;color:var(--body);font-family:inherit;cursor:pointer;transition:border-color .15s,background .15s}
.swap .sub:hover{border-color:var(--olive-lt)}
.swap .sub.on{border-color:var(--gold);background:linear-gradient(90deg,rgba(193,173,114,.18),rgba(255,255,255,.03));color:#fff;font-weight:700}
.swap .sub .tag{font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);font-weight:700;margin-left:6px}
.swap .addown{display:flex;gap:8px;margin-top:2px}
.swap .custinp{flex:1;min-width:0;background:rgba(255,255,255,.04);border:1px solid var(--field-line);border-radius:10px;color:var(--parch);font-family:inherit;font-size:.85rem;padding:11px 12px;outline:none}
.swap .custinp:focus{border-color:var(--gold)}
.swap .custbtn{background:var(--gold);color:var(--ink);border:none;border-radius:10px;font-family:inherit;font-weight:800;font-size:.8rem;padding:0 16px;cursor:pointer;white-space:nowrap}
.sinp{font-family:Cinzel,serif;font-weight:700;font-size:1.5rem;color:#fff;background:transparent;border:none;text-align:center;width:76px;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.sinp::-webkit-outer-spin-button,.sinp::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.sinp:focus{outline:none;color:var(--gold)}

/* LP Coach recommendation */
.coach{background:linear-gradient(90deg,rgba(193,173,114,.18),rgba(255,255,255,.03));border:1px solid var(--gold-dim);border-left:3px solid var(--gold);border-radius:12px;padding:11px 13px;margin-bottom:12px}
.coach .ck{font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:800;margin-bottom:3px}
.coach .ct{font-size:.87rem;color:#fff;line-height:1.5;font-weight:600}
/* logged set list */
.sets{display:grid;gap:7px;margin-bottom:12px}
.setrow{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;background:rgba(255,255,255,.03);border:1px solid var(--field-line);border-radius:11px;padding:11px 12px}
.setrow .sn{font-family:Cinzel,serif;font-weight:700;color:var(--gold);text-align:center}
.setrow .sv{font-weight:700;color:#fff;font-size:.96rem}
.setrow .sv small{color:var(--soft);font-weight:600;font-size:.78rem}
.setrow .pr{color:var(--gold);font-size:.62rem;letter-spacing:.1em;font-weight:800;text-transform:uppercase}

/* logger (FitNotes-style) */
.logger{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stepper{background:rgba(255,255,255,.03);border:1px solid var(--field-line);border-radius:12px;padding:10px}
.stepper .k{font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);font-weight:700;text-align:center}
.stepper .row{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:6px}
.sbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--field-line);background:rgba(255,255,255,.04);color:var(--parch);font-size:1.3rem;font-weight:700;cursor:pointer;line-height:1}
.sbtn:active{background:var(--gold);color:var(--ink)}
.sval{font-family:Cinzel,serif;font-weight:700;font-size:1.5rem;color:#fff;min-width:56px;text-align:center;font-variant-numeric:tabular-nums}
.save{grid-column:1 / -1;background:var(--gold);color:var(--ink);border:none;border-radius:12px;font-family:inherit;font-weight:800;font-size:.95rem;padding:14px;cursor:pointer;letter-spacing:.03em;margin-top:2px}
.save:active{transform:translateY(1px)}

/* finish bar */
.finish{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:14px 18px calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(15,19,16,0),#0f1310 30%)}
.finish .fin-in{max-width:460px;margin:0 auto}
.fbtn{display:block;width:100%;background:var(--olive);color:#fff;border:none;border-radius:13px;font-family:inherit;font-weight:800;font-size:.98rem;padding:16px;cursor:pointer;letter-spacing:.02em}
.prog{font-size:.72rem;color:var(--soft);text-align:center;margin-bottom:9px;font-weight:600}
</style>
</head>
<body>
<main class="wrap">
  <div class="top">
    <img src="../logo-white-gold.png" alt="Legacy Performance">
    <button class="tbtn ghost" onclick="location.href='../client.html'">Done</button>
  </div>

  <div class="eyebrow">Week 1 · Day A · Lower</div>
  <h1>Lower A</h1>
  <p class="sub">4 blocks · tap an exercise to log your sets. It remembers last time.</p>

  <div class="timer">
    <div class="tcol"><div class="tlab">Workout</div><div class="tval" id="wkTime">0:00</div></div>
    <div class="tcol"><div class="tlab">Rest</div><div class="tval gold" id="restTime">0:00</div></div>
    <button class="tbtn ghost" onclick="resetRest()">Reset rest</button>
  </div>

  <div id="list"></div>
</main>

<div class="finish"><div class="fin-in">
  <div class="prog" id="prog"></div>
  <button class="fbtn" onclick="finish()">Finish workout ✓</button>
</div></div>

<script>
/* Sample LP Training System day. In the real thing this comes from the member's 12-week program. */
function yt(q){ return 'https://www.youtube.com/results?search_query='+encodeURIComponent(q+' proper form'); }
/* Each lift has a REP RANGE (double progression): work in the range; when you hit the TOP of the
   range on all your sets, add weight next time (inc). Upper body ~5 lb, lower body ~10 lb. */
var DAY=[
  {k:'A', name:'Barbell Split Squat', warmup:'2 sets', sets:3, lo:6, hi:8, unit:' / side', rir:'RIR 1-2', rest:'2-3 min', sub1:'Dumbbell Split Squat', sub2:'Leg Press', note:'Pause one second at the bottom and drive through the front heel. Control the way down, full range on every rep.', inc:10, last:'95 lb × 6', vid:yt('barbell split squat'), w:95, r:6},
  {k:'B', name:'Barbell Incline Bench Press', warmup:'2-4 sets', sets:3, lo:8, hi:10, unit:'', rir:'RIR 1', rest:'3-5 min', sub1:'Smith Machine Incline Press', sub2:'Dumbbell Incline Press', note:'Set a 30 to 45 degree bench. Touch the upper chest and press without bouncing. Keep tension on the pecs.', inc:5, last:'115 lb × 8', vid:yt('barbell incline bench press'), w:115, r:8},
  {k:'C', name:'Romanian Deadlift', warmup:'2 sets', sets:3, lo:8, hi:10, unit:'', rir:'RIR 2', rest:'2-3 min', sub1:'Dumbbell RDL', sub2:'Back Extension', note:'Soft knees, push the hips back, feel the hamstrings load. Stop the rep when your back wants to round.', inc:10, last:'155 lb × 8', vid:yt('romanian deadlift'), w:155, r:8},
  {k:'D', name:'Chest-Supported Row', warmup:'1-2 sets', sets:3, lo:10, hi:12, unit:'', rir:'RIR 1', rest:'1-2 min', sub1:'Seal Row', sub2:'Machine Row', note:'Pull to the belly and squeeze the shoulder blades. Let them spread apart on the way down, under control.', inc:5, last:'70 lb × 10', vid:yt('chest supported row'), w:70, r:10}
];
function tgt(x){ return x.sets+' × '+x.lo+'-'+x.hi+x.unit; }
/* THE LP COACH RECOMMENDATION — double progression. Runs once the working sets are in. */
function coachRec(i){
  var x=DAY[i], sets=LOG[i]||[];
  if(sets.length < x.sets) return null;                 // still working through the sets
  var work=sets.slice(-x.sets);                         // the last N = this session's working sets
  var allTop=work.every(function(s){return s.r>=x.hi;});
  var anyBelow=work.some(function(s){return s.r<x.lo;});
  if(allTop)   return {t:'up',   msg:'You hit the top of the range on every set. Go up '+x.inc+' lb next time. You earned it.'};
  if(anyBelow) return {t:'hold', msg:'That one was a grind. Hold this weight next time and build back to '+x.lo+' clean reps on all sets.'};
  return {t:'stay', msg:'Solid work. Stay at this weight and add reps until you hit '+x.hi+' on every set, then we go heavier.'};
}
var LOG={};   // exIndex -> [{w,r,pr}]
try{ LOG=JSON.parse(localStorage.getItem('lp_wk_demo')||'{}'); }catch(e){ LOG={}; }
var openIdx=0;

function bestFor(i){ var arr=LOG[i]||[]; var b=0; arr.forEach(function(s){ if(s.w*s.r>b) b=s.w*s.r; }); return b; }
var SWAPS_D={}; try{ SWAPS_D=JSON.parse(localStorage.getItem('lp_wk_demo_swaps')||'{}'); }catch(e){ SWAPS_D={}; }
function swapDTo(i,nm){ SWAPS_D[i]=nm; try{ localStorage.setItem('lp_wk_demo_swaps', JSON.stringify(SWAPS_D)); }catch(e){} render(); }
function swapDCustom(i){ var el=document.getElementById('cust'+i); var v=(el&&el.value||'').trim(); if(v) swapDTo(i,v); }
function render(){
  document.getElementById('list').innerHTML=DAY.map(function(x,i){
    var sets=LOG[i]||[];
    var done=sets.length>=3;
    var activeName=SWAPS_D[i]||x.name; var opts=[x.name,x.sub1,x.sub2].filter(Boolean); var custActive=opts.indexOf(activeName)<0;
    var setHtml=sets.map(function(s,si){
      return '<div class="setrow"><div class="sn">'+(si+1)+'</div><div class="sv">'+s.w+' <small>lb</small> × '+s.r+' <small>reps</small></div>'+(s.pr?'<div class="pr">★ PR</div>':'<div></div>')+'</div>';
    }).join('');
    var rec=coachRec(i);
    var recHtml=rec?('<div class="coach"><div class="ck">◆ LP Coach</div><div class="ct">'+rec.msg+'</div></div>'):'';
    return '<div class="ex'+(i===openIdx?' open':'')+(done?' done':'')+'" id="ex'+i+'">'
      +'<div class="ex-head" onclick="toggle('+i+')"><div class="blk">'+x.k+'</div>'
      +'<div><div class="ex-name">'+activeName+'</div><div class="ex-meta">'+tgt(x)+' · '+x.rir+' · <span class="last">last '+x.last+'</span></div></div>'
      +'<div class="chev">›</div></div>'
      +'<div class="ex-body">'
      +'<div class="detail">'
        +'<div class="d"><span>Warm-up</span><b>'+x.warmup+'</b></div>'
        +'<div class="d"><span>Working</span><b>'+tgt(x)+'</b></div>'
        +'<div class="d"><span>Intensity</span><b>'+x.rir+'</b></div>'
        +'<div class="d"><span>Rest</span><b>'+x.rest+'</b></div>'
      +'</div>'
      +'<div class="note">'+x.note+'</div>'
      +'<details class="swap"><summary>⇄ Swap this exercise</summary><div class="subs">'
        +(custActive?'<button class="sub on">✓ '+activeName+'<span class="tag">yours</span></button>':'')
        +opts.map(function(nm,oi){var on=(nm===activeName);return '<button class="sub'+(on?' on':'')+'" data-nm="'+String(nm).replace(/"/g,'&quot;')+'" onclick="swapDTo('+i+',this.getAttribute(\'data-nm\'))">'+(on?'✓ ':'')+nm+(oi===0?'<span class="tag">original</span>':'')+'</button>';}).join('')
        +'<div class="addown"><input class="custinp" id="cust'+i+'" type="text" placeholder="Type your own exercise"><button class="custbtn" onclick="swapDCustom('+i+')">Use</button></div>'
      +'</div></details>'
      +'<a class="vid" href="'+x.vid+'" target="_blank" rel="noopener">▶ Watch the demo on YouTube</a>'
      +(setHtml?'<div class="sets">'+setHtml+'</div>':'')
      +recHtml
      +'<div class="logger">'
      +'<div class="stepper"><div class="k">Weight (lb)</div><div class="row"><button class="sbtn" onclick="bump('+i+',\'w\',-2.5)">−</button><input class="sinp" id="w'+i+'" type="number" inputmode="decimal" step="2.5" value="'+x.w+'"><button class="sbtn" onclick="bump('+i+',\'w\',2.5)">+</button></div></div>'
      +'<div class="stepper"><div class="k">Reps</div><div class="row"><button class="sbtn" onclick="bump('+i+',\'r\',-1)">−</button><input class="sinp" id="r'+i+'" type="number" inputmode="numeric" step="1" value="'+x.r+'"><button class="sbtn" onclick="bump('+i+',\'r\',1)">+</button></div></div>'
      +'<button class="save" onclick="saveSet('+i+')">Save set '+(sets.length+1)+' →</button>'
      +'</div></div></div>';
  }).join('');
  var totalSets=DAY.reduce(function(a,_,i){return a+((LOG[i]||[]).length);},0);
  var doneEx=DAY.filter(function(_,i){return (LOG[i]||[]).length>=3;}).length;
  document.getElementById('prog').textContent=doneEx+' of '+DAY.length+' exercises done · '+totalSets+' sets logged';
}
function toggle(i){ openIdx=(openIdx===i?-1:i); startClock(); render(); }
function bump(i,f,d){ var el=document.getElementById(f+i); var v=(parseFloat(el.value)||0)+d; if(f==='w')v=Math.max(0,Math.round(v*2)/2); if(f==='r')v=Math.max(1,Math.round(v)); el.value=v; }
function saveSet(i){
  var w=parseFloat(document.getElementById('w'+i).value)||0, r=parseInt(document.getElementById('r'+i).value,10)||0;
  if(!r) return;
  var prevBest=bestFor(i);
  var pr = (w*r)>prevBest && prevBest>0 ? true : (prevBest===0 ? false : false);
  LOG[i]=LOG[i]||[]; LOG[i].push({w:w,r:r,pr:pr});
  try{ localStorage.setItem('lp_wk_demo', JSON.stringify(LOG)); }catch(e){}
  markSet();
  render();
}
/* rest timer */
var sessionStart=null, lastSet=null, CLK=null;
function fmt(s){ var h=Math.floor(s/3600),m=Math.floor((s%3600)/60),ss=s%60; return (h?h+':'+('0'+m).slice(-2):''+m)+':'+('0'+ss).slice(-2); }
function tick(){ var now=Date.now();
  var a=document.getElementById('wkTime'); if(a) a.textContent=sessionStart?fmt(Math.floor((now-sessionStart)/1000)):'0:00';
  var b=document.getElementById('restTime'); if(b) b.textContent=lastSet?fmt(Math.floor((now-lastSet)/1000)):'0:00'; }
function startClock(){ if(!sessionStart)sessionStart=Date.now(); if(!CLK)CLK=setInterval(tick,1000); tick(); }
function markSet(){ lastSet=Date.now(); startClock(); }
function resetRest(){ lastSet=Date.now(); startClock(); }
function finish(){ alert('Nice work. Your sets are saved and would flow into your weekly check-in.'); }
render();
</script>
</body>
</html>

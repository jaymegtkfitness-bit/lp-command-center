<!DOCTYPE html>
<html lang="en">
<head>
<!-- PRIVATE personal workout tracker — Jayme only. Loads a program the user OWNS (personal use).
     This folder is GITIGNORED: never published, never part of the for-sale product.
     Reads ./min-max.json (the parsed program). Logging is localStorage on this device. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#141310">
<title>My Training</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#141310;--olive:#4A5C3E;--olive-lt:#8FA97A;--olive-dim:rgba(143,169,122,.22);--parch:#F2EDE4;--gold:#C1AD72;--gold-dim:rgba(193,173,114,.3);--soft:#a49d90;--body:#d9d3c8;--field:rgba(255,255,255,.05);--field-line:rgba(242,237,228,.14)}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--ink)}
html,body,*{scrollbar-width:none;-ms-overflow-style:none}html::-webkit-scrollbar,body::-webkit-scrollbar,*::-webkit-scrollbar{width:0;height:0;display:none}
body{min-height:100vh;font-family:Montserrat,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--parch);-webkit-font-smoothing:antialiased;line-height:1.5;overflow-x:hidden;
  background:radial-gradient(ellipse 70% 34% at 50% 2%, rgba(193,173,114,.09), transparent 60%),radial-gradient(ellipse 105% 50% at 0% 100%, rgba(74,92,62,.5), transparent 74%),linear-gradient(180deg,#1a1813 0%,#141510 55%,#0f1310 100%);background-attachment:fixed}
.wrap{position:relative;z-index:1;max-width:540px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) 10px calc(96px + env(safe-area-inset-bottom))}
.eyebrow{font-size:.66rem;letter-spacing:.26em;text-transform:uppercase;color:var(--gold);font-weight:700}
h1{font-weight:900;font-size:1.9rem;letter-spacing:-.01em;text-transform:uppercase;line-height:1.05;margin-top:6px}
.pnotes{margin-top:10px}
.pnotes summary{cursor:pointer;font-size:.78rem;font-weight:700;color:var(--gold);list-style:none}
.pnotes summary::-webkit-details-marker{display:none}
.pnotes .body{margin-top:8px;font-size:.82rem;color:var(--body);line-height:1.55;background:rgba(255,255,255,.03);border:1px solid var(--field-line);border-radius:12px;padding:12px 14px}
/* nav */
.nav{display:flex;gap:8px;overflow-x:auto;margin-top:16px;padding-bottom:4px;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nchip{flex:0 0 auto;background:rgba(255,255,255,.04);border:1px solid var(--field-line);color:var(--body);font-family:inherit;font-weight:700;font-size:.8rem;padding:8px 14px;border-radius:99px;cursor:pointer;white-space:nowrap}
.nchip.on{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.navlabel{font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);font-weight:700;margin:16px 0 8px}
/* timer */
.timer{position:sticky;top:8px;z-index:5;margin-top:16px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:linear-gradient(90deg,rgba(84,106,70,.22),rgba(20,19,16,.85));backdrop-filter:blur(8px);border:1px solid var(--olive-dim);border-radius:14px;padding:11px 13px}
.timer .tlab{font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;color:var(--soft);font-weight:700}
.timer .tval{font-family:Cinzel,serif;font-weight:700;font-size:1.4rem;color:#fff;font-variant-numeric:tabular-nums}
.timer .tval.gold{color:var(--gold)}
.timer .tcol{display:flex;flex-direction:column}
.tbtn{background:var(--gold);color:var(--ink);border:none;border-radius:10px;font-family:inherit;font-weight:800;font-size:.76rem;padding:9px 12px;cursor:pointer}
.tbtn.ghost{background:transparent;border:1px solid var(--field-line);color:var(--parch)}
/* exercise */
.ex{margin-top:11px;background:rgba(255,255,255,.02);border:1px solid var(--field-line);border-radius:16px;overflow:hidden}
.ex.done{border-color:var(--olive-dim)}
.ex-head{display:grid;grid-template-columns:30px 1fr auto;gap:11px;align-items:center;padding:14px 14px;cursor:pointer}
.blk{width:30px;height:30px;border-radius:8px;background:rgba(193,173,114,.16);display:grid;place-items:center;color:var(--gold);font-family:Cinzel,serif;font-weight:700;font-size:.9rem}
.ex.done .blk{background:var(--olive);color:#fff}
.ex-name{font-size:1rem;font-weight:800;color:#fff;line-height:1.2}
.ex-meta{font-size:.78rem;color:var(--soft);margin-top:2px}
.ex-meta .last{color:var(--olive-lt)}
.chev{color:var(--soft);font-size:1.1rem;transition:transform .2s}
.ex.open .chev{transform:rotate(90deg)}
.ex-body{display:none;padding:0 14px 14px}
.ex.open .ex-body{display:block}
.detail{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.detail .d{background:rgba(255,255,255,.03);border:1px solid var(--field-line);border-radius:10px;padding:9px 11px}
.detail .d span{display:block;font-size:.54rem;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);font-weight:700;margin-bottom:2px}
.detail .d b{font-size:.88rem;color:#fff;font-weight:800}
.note{background:rgba(193,173,114,.08);border-left:3px solid var(--gold);border-radius:0 10px 10px 0;padding:9px 12px;margin-bottom:12px;font-size:.82rem;color:var(--body);line-height:1.5}
.swap{margin-bottom:12px}
.swap summary{cursor:pointer;font-size:.78rem;font-weight:700;color:var(--gold);list-style:none}
.swap summary::-webkit-details-marker{display:none}
.swap .subs{margin-top:8px;display:grid;gap:6px}
.swap .sub{display:block;width:100%;text-align:left;background:rgba(255,255,255,.03);border:1px solid var(--field-line);border-radius:10px;padding:12px 12px;font-size:.86rem;color:var(--body);font-family:inherit;cursor:pointer;transition:border-color .15s,background .15s}
.swap .sub:hover{border-color:var(--olive-lt)}
.swap .sub.on{border-color:var(--gold);background:linear-gradient(90deg,rgba(193,173,114,.18),rgba(255,255,255,.03));color:#fff;font-weight:700}
.swap .sub .tag{font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);font-weight:700;margin-left:6px}
.swap .addown{display:flex;gap:8px;margin-top:2px}
.swap .custinp{flex:1;min-width:0;background:rgba(255,255,255,.04);border:1px solid var(--field-line);border-radius:10px;color:var(--parch);font-family:inherit;font-size:.85rem;padding:11px 12px;outline:none}
.swap .custinp:focus{border-color:var(--gold)}
.swap .custbtn{background:var(--gold);color:var(--ink);border:none;border-radius:10px;font-family:inherit;font-weight:800;font-size:.8rem;padding:0 16px;cursor:pointer;white-space:nowrap}
.coach{background:linear-gradient(90deg,rgba(193,173,114,.18),rgba(255,255,255,.03));border:1px solid var(--gold-dim);border-left:3px solid var(--gold);border-radius:12px;padding:11px 13px;margin-bottom:12px}
.coach .ck{font-size:.58rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:800;margin-bottom:3px}
.coach .ct{font-size:.86rem;color:#fff;line-height:1.5;font-weight:600}
.sets{display:grid;gap:7px;margin-bottom:12px}
.setrow{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:center;background:rgba(255,255,255,.03);border:1px solid var(--field-line);border-radius:11px;padding:10px 12px}
.setrow .sn{font-family:Cinzel,serif;font-weight:700;color:var(--gold);text-align:center}
.setrow .sv{font-weight:700;color:#fff;font-size:.94rem}
.setrow .sv small{color:var(--soft);font-weight:600;font-size:.76rem}
.setrow .pr{color:var(--gold);font-size:.6rem;letter-spacing:.1em;font-weight:800;text-transform:uppercase}
.logger{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stepper{background:rgba(255,255,255,.03);border:1px solid var(--field-line);border-radius:12px;padding:10px}
.stepper .k{font-size:.58rem;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);font-weight:700;text-align:center}
.stepper .row{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:6px}
.sbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--field-line);background:rgba(255,255,255,.04);color:var(--parch);font-size:1.25rem;font-weight:700;cursor:pointer;line-height:1}
.sbtn:active{background:var(--gold);color:var(--ink)}
.sval{font-family:Cinzel,serif;font-weight:700;font-size:1.4rem;color:#fff;min-width:52px;text-align:center;font-variant-numeric:tabular-nums}
.sinp{font-family:Cinzel,serif;font-weight:700;font-size:1.4rem;color:#fff;background:transparent;border:none;text-align:center;width:72px;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.sinp::-webkit-outer-spin-button,.sinp::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.sinp:focus{outline:none;color:var(--gold)}
.save{grid-column:1/-1;background:var(--gold);color:var(--ink);border:none;border-radius:12px;font-family:inherit;font-weight:800;font-size:.92rem;padding:13px;cursor:pointer;margin-top:2px}
.finish{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(15,19,16,0),#0f1310 30%)}
.finish .fin-in{max-width:540px;margin:0 auto}
.fbtn{display:block;width:100%;background:var(--olive);color:#fff;border:none;border-radius:13px;font-family:inherit;font-weight:800;font-size:.96rem;padding:15px;cursor:pointer}
.prog{font-size:.7rem;color:var(--soft);text-align:center;margin-bottom:8px;font-weight:600}
.load{padding:40px 10px;text-align:center;color:var(--soft)}
</style>
</head>
<body>
<!-- When embedded inside the dashboard's Workouts tab, hide this page's own header (the app frames it). -->
<script>try{if(new URLSearchParams(location.search).get('embed')||window.self!==window.top)document.documentElement.classList.add('embed');}catch(e){if(window.self!==window.top)document.documentElement.classList.add('embed');}</script>
<style>html.embed .eyebrow,html.embed #title{display:none}html.embed .wrap{padding-top:12px}
.celebrate{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:22px;background:rgba(8,9,7,.8);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.cel-card{max-width:400px;width:100%;max-height:88vh;overflow-y:auto;text-align:center;background:linear-gradient(160deg,rgba(193,173,114,.16),rgba(84,106,70,.12)),#141510;border:1px solid rgba(193,173,114,.34);border-radius:22px;padding:28px 24px 22px;box-shadow:0 30px 70px rgba(0,0,0,.6)}
.cel-emoji{font-size:4.8rem;line-height:1;margin:10px 0 2px}
.cel-sec{margin-top:16px;text-align:left;background:rgba(255,255,255,.03);border:1px solid var(--field-line);border-radius:14px;padding:12px 14px}
.cel-sh{font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:800;margin-bottom:4px}
.cel-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid rgba(143,169,122,.12);font-size:.9rem;color:var(--body)}
.cel-row:last-child{border-bottom:0}.cel-row b{color:#fff;font-weight:800;white-space:nowrap}
.cel-h{font-weight:900;text-transform:uppercase;font-size:1.15rem;letter-spacing:.02em;color:#fff}
.cel-lab{font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:800;margin-top:16px}
.cel-num{font-family:Cinzel,serif;font-weight:700;font-size:2.7rem;color:#fff;line-height:1;margin-top:4px;font-variant-numeric:tabular-nums}
.cel-cmp{font-size:1.02rem;color:var(--body);margin-top:8px}.cel-cmp b{color:var(--gold)}
.cel-alt{font-size:.8rem;color:var(--soft);margin-top:4px}.cel-alt b{color:var(--soft)}
.cel-share{width:100%;background:var(--gold);color:var(--ink);border:none;border-radius:12px;font-family:inherit;font-weight:800;font-size:.95rem;padding:15px;margin-top:22px;cursor:pointer}
.cel-done{width:100%;background:transparent;border:1px solid var(--field-line);color:var(--parch);border-radius:12px;font-family:inherit;font-weight:700;font-size:.9rem;padding:13px;margin-top:10px;cursor:pointer}
/* Workout OVERVIEW (day detail before you start) */
.ovhero{position:relative;border-radius:18px;overflow:hidden;padding:20px 16px;margin-bottom:14px;min-height:150px;display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(180deg,rgba(8,9,7,.05) 18%,rgba(8,9,7,.88) 100%),linear-gradient(120deg,#2b3327,#15130f 72%)}
.ovhero:after{content:"";position:absolute;inset:0;background:radial-gradient(80% 120% at 82% 0%,rgba(125,148,99,.4),transparent 60%),radial-gradient(60% 90% at 8% 92%,rgba(193,173,114,.28),transparent 60%);opacity:.6}
.ovttl{position:relative;font-family:Montserrat,sans-serif;font-weight:900;font-size:1.55rem;text-transform:uppercase;color:#fff;line-height:1.05;letter-spacing:.005em}
.ovpills{position:relative;display:flex;gap:8px;margin-top:11px}
.ovpill{font-size:.72rem;font-weight:700;color:var(--parch);background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.14);padding:6px 13px;border-radius:999px;backdrop-filter:blur(3px)}
.ovdesc{font-size:.9rem;color:var(--soft);line-height:1.5;margin-bottom:18px}
.ovh{font-family:Montserrat,sans-serif;font-weight:800;font-size:1.15rem;color:#fff;margin:6px 0 12px}
.ovex{display:flex;align-items:center;gap:13px;background:var(--field);border:1px solid var(--field-line);border-radius:14px;padding:11px;margin-bottom:10px}
.ovthumb{width:58px;height:58px;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center;font-size:1rem;color:var(--gold);background:linear-gradient(140deg,#2b3327,#14140f)}
.ovb{flex:1;min-width:0}
.ovnm{font-weight:700;font-size:.98rem;color:#fff}
.ovsr{font-size:.8rem;color:var(--soft);margin-top:3px}
/* big center workout timer */
.timer.big{flex-direction:column;gap:7px;align-items:center;text-align:center;background:linear-gradient(160deg,rgba(84,106,70,.18),rgba(20,19,16,.85));padding:9px 12px}
.timer.big .tk-big{font-family:Montserrat,sans-serif;font-weight:900;font-size:1.85rem;color:#fff;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.timer.big .tlab{font-size:.52rem}
.timer.big .tk-rest{display:flex;align-items:center;gap:9px;font-size:.8rem}
.timer.big .tk-rest .tval{font-size:.95rem}
.timer.big .tk-rest .tbtn{padding:5px 11px;font-size:.68rem}
.timer.big .tk-main{display:flex;flex-direction:row;align-items:center;gap:12px}
.timer.big #startBtn{padding:6px 20px;font-size:.76rem}
/* superset grouping — a labelled connector between two linked exercise cards */
.kx.ss{border-color:var(--gold-dim)}
.kx-sslink{position:relative;display:flex;align-items:center;justify-content:center;height:24px;margin:2px 0}
.kx-sslink:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--gold-dim);transform:translateX(-50%)}
.kx-sslink span{position:relative;z-index:1;font-size:.56rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:800;background:rgba(193,173,114,.14);border:1px solid var(--gold-dim);border-radius:999px;padding:3px 11px}
.kx-tool.on{background:linear-gradient(160deg,rgba(193,173,114,.3),rgba(193,173,114,.1));border-color:var(--gold-dim);color:#fff}
/* Kino-style exercise card */
.kx{margin-top:12px;background:rgba(255,255,255,.02);border:1px solid var(--field-line);border-radius:18px;padding:14px}
.kx.done{border-color:var(--olive-dim);background:rgba(84,106,70,.08)}
.kx-top{display:flex;align-items:flex-start;gap:12px}
.kx-thumb{width:46px;height:46px;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center;font-size:.95rem;color:var(--gold);background:linear-gradient(140deg,#2b3327,#14140f)}
.kx-nm{flex:1;min-width:0;font-family:Montserrat,sans-serif;font-weight:800;font-size:1.02rem;color:#fff;line-height:1.2;align-self:center}
.kx-tools{display:flex;flex-direction:column;gap:6px;flex:none}
.kx-tool{display:flex;align-items:center;justify-content:center;gap:5px;background:rgba(255,255,255,.05);border:1px solid var(--field-line);color:var(--gold);border-radius:9px;font-family:inherit;font-weight:700;font-size:.74rem;padding:8px 10px;cursor:pointer;white-space:nowrap}
.kx-actions{display:flex;gap:8px;margin-top:11px}
.kx-actions .kx-tool{flex:1}
.kx-delrow{margin-top:12px;padding-top:11px;border-top:1px solid var(--field-line);display:flex;justify-content:center}
.kx-del{background:transparent;border:none;color:var(--soft);font-family:inherit;font-weight:700;font-size:.78rem;display:flex;align-items:center;gap:6px;cursor:pointer;padding:4px 10px}
.kx-del:active{color:#e8928a}
.kx-add{margin-top:14px;display:flex;gap:8px}
.kx-add input{flex:1;min-width:0;background:rgba(255,255,255,.04);border:1px solid var(--field-line);border-radius:12px;color:var(--parch);font-family:inherit;font-size:.86rem;padding:12px}
.kx-add input:focus{outline:none;border-color:var(--gold)}
.kx-add button{background:rgba(193,173,114,.14);color:var(--gold);border:1px solid var(--gold-dim);border-radius:12px;font-family:inherit;font-weight:800;font-size:.84rem;padding:0 18px;cursor:pointer;white-space:nowrap}
.kx-info{font-size:.82rem;color:var(--soft);line-height:1.45;margin-top:12px}
.kx-info .ii{color:var(--gold);font-weight:800}
.kx-info.clip{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.kx-more{color:var(--gold);font-weight:700;font-size:.78rem;margin-top:5px;cursor:pointer;display:inline-block}
.kx-btns{display:flex;gap:8px;margin-top:12px}
.kx-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;background:transparent;border:1px solid var(--field-line);color:var(--parch);border-radius:11px;font-family:inherit;font-weight:700;font-size:.78rem;padding:10px;cursor:pointer}
.kx-panel{margin-top:10px;background:rgba(255,255,255,.03);border:1px solid var(--field-line);border-radius:12px;padding:11px 12px;font-size:.83rem;color:var(--body);line-height:1.5}
.kx-panel textarea{width:100%;background:rgba(0,0,0,.25);border:1px solid var(--field-line);border-radius:9px;color:#fff;font-family:inherit;font-size:.85rem;padding:9px;min-height:64px;resize:vertical}
.kx-sets{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--field-line)}
.kx-sets .sl{font-weight:800;font-size:.82rem;color:#fff}
.kx-sets .sr{font-size:.8rem;color:var(--soft)}
.kx-weight{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:12px}
.kx-weight .k{font-size:.58rem;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);font-weight:700}
.kx-wv{font-family:Montserrat,sans-serif;font-weight:900;font-size:1.5rem;color:#fff;background:transparent;border:none;text-align:center;width:74px;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.kx-wv::-webkit-outer-spin-button,.kx-wv::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.kx-wv:focus{outline:none;color:var(--gold)}
.kx-sbtn{width:38px;height:38px;border-radius:11px;border:1px solid var(--field-line);background:rgba(255,255,255,.04);color:var(--parch);font-size:1.3rem;font-weight:700;cursor:pointer;line-height:1}
.kx-sbtn:active{background:var(--gold);color:var(--ink)}
.kx-bubbles{display:flex;flex-wrap:wrap;gap:9px;margin-top:13px}
.kx-bub{flex:1;min-width:82px;text-align:center;padding:12px 6px;border-radius:13px;border:1px solid var(--gold-dim);background:rgba(193,173,114,.06);color:var(--gold-soft,#d8c789);font-weight:800;font-size:.9rem;cursor:pointer}
.kx-bub.done{background:linear-gradient(160deg,var(--olive),#3f5233);border-color:transparent;color:#fff;position:relative}
.kx-bub.done .xrm{position:absolute;top:3px;right:6px;font-size:.58rem;color:rgba(255,255,255,.55);font-weight:700}
.kx-bub.done .bw{display:block;font-size:.68rem;font-weight:700;color:rgba(255,255,255,.8);margin-top:2px}
.kx-bub .pr{color:var(--gold)}
.kx-prev{font-size:.78rem;color:var(--soft);margin-top:12px}
.kx-hint{font-size:.8rem;color:var(--soft);margin:2px 2px 0;display:flex;align-items:center;gap:7px}
.kx-logger{display:flex;gap:10px;margin-top:13px}
.kx-field{flex:1;background:rgba(255,255,255,.03);border:1px solid var(--field-line);border-radius:12px;padding:10px 8px;text-align:center}
.kx-field .k{font-size:.58rem;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);font-weight:700;margin-bottom:7px}
.kx-step{display:flex;align-items:center;justify-content:center;gap:4px}
.kx-logbtn{display:block;width:100%;margin-top:10px;background:var(--gold);color:var(--ink);border:none;border-radius:12px;font-family:inherit;font-weight:800;font-size:.92rem;padding:13px;cursor:pointer}
.kx-bwtoggle{display:block;width:100%;margin-top:10px;background:rgba(255,255,255,.04);border:1px solid var(--field-line);color:var(--body);border-radius:11px;font-family:inherit;font-weight:700;font-size:.82rem;padding:11px;cursor:pointer}
.kx-bwtoggle.on{background:linear-gradient(160deg,var(--olive),#3f5233);border-color:transparent;color:#fff}</style>
<main class="wrap">
  <div class="eyebrow">Private · Personal use</div>
  <h1 id="title">My Training</h1>
  <div id="notesWrap"></div>
  <div class="navlabel" id="wkLabel" style="display:none">Week</div>
  <div class="nav" id="weeks"></div>
  <div class="navlabel" id="dayLabel" style="display:none">Day</div>
  <div class="nav" id="days"></div>
  <div class="timer big" id="timerBar" style="display:none">
    <div class="tk-main"><div class="tlab">Workout</div><div class="tk-big" id="wkTime">0:00</div>
      <button class="tbtn" id="startBtn" onclick="toggleWorkoutClock()">Start</button></div>
    <div class="tk-rest"><span class="tlab">Rest</span><span class="tval gold" id="restTime">0:00</span><button class="tbtn" id="restBtn" onclick="startRest()">Start rest</button></div>
  </div>
  <div id="list"><div class="load">Loading your program…</div></div>
</main>
<div class="finish" id="finishBar" style="display:none"><div class="fin-in"><div class="prog" id="prog"></div><button class="fbtn" onclick="finish()">Finish workout ✓</button></div></div>

<!-- Post-workout celebration (revealed on Finish, shareable) -->
<div class="celebrate" id="celebrate" style="display:none">
  <div class="cel-card">
    <div class="cel-h">Workout complete</div>
    <div class="cel-lab">Total moved this workout</div>
    <div class="cel-emoji" id="celEmoji">🏋️</div>
    <div class="cel-num" id="celNum">0 lb</div>
    <div class="cel-cmp" id="celCmp"></div>
    <div class="cel-sec" id="celPRs" style="display:none"><div class="cel-sh">★ New PRs</div><div id="celPRList"></div></div>
    <div class="cel-sec" id="celLevel" style="display:none"><div class="cel-sh">◆ Go heavier next time</div><div id="celLevelList"></div></div>
    <button class="cel-share" id="celShare" onclick="shareTonnage()">Share my workout →</button>
    <button class="cel-done" onclick="closeCelebrate()">Done</button>
  </div>
</div>

<script src="../tonnage.js"></script>
<script>
var PROG=null, wi=0, di=0, openIdx=0, LOG={}, SWAPS={}, MODE='overview';
try{ LOG=JSON.parse(localStorage.getItem('lp_myprog')||'{}'); }catch(e){ LOG={}; }
try{ SWAPS=JSON.parse(localStorage.getItem('lp_myprog_swaps')||'{}'); }catch(e){ SWAPS={}; }
var SS={}; try{ SS=JSON.parse(localStorage.getItem('lp_myprog_ss')||'{}'); }catch(e){ SS={}; }
/* Mark this exercise as supersetted with the NEXT one (or clear it). The program can also
   pre-set ex.superset:true to ship a superset; this toggle lets the member add their own. */
function toggleSS(ei){ var k=exKey(ei); SS[k]=!SS[k]; try{ localStorage.setItem('lp_myprog_ss', JSON.stringify(SS)); }catch(e){} renderList(); }
function swapTo(ei, nm){ SWAPS[exKey(ei)]=nm; try{ localStorage.setItem('lp_myprog_swaps', JSON.stringify(SWAPS)); }catch(e){} renderList(); }
function swapCustom(ei){ var el=document.getElementById('cust'+ei); var v=(el&&el.value||'').trim(); if(v) swapTo(ei, v); }
function esc(s){ return String(s==null?'':s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];}); }
function flatDays(){ // [{block,label,week,day,exercises}]
  var out=[]; (PROG.blocks||[]).forEach(function(b){ (b.weeks||[]).forEach(function(w){ (w.days||[]).forEach(function(d){ out.push({block:b.block,label:b.label,week:w.week,day:d.day,exercises:d.exercises||[]}); }); }); }); return out;
}
function weeksList(){ var seen={},out=[]; flatDays().forEach(function(x){ var key=(x.block||'')+'|'+x.week; if(!seen[key]){seen[key]=1;out.push(x);} }); return out; }
function daysForWeek(wkKey){ return flatDays().filter(function(x){ return (x.block||'')+'|'+x.week===wkKey; }); }
function rng(repRange){ var m=String(repRange||'').match(/(\d+)\s*-\s*(\d+)/); if(m)return[+m[1],+m[2]]; var n=String(repRange||'').match(/(\d+)/); return n?[+n[1],+n[1]]:[8,10]; }
function rirStr(r){ if(Array.isArray(r))return 'RIR '+r.filter(function(x){return x!=='';}).join('-'); return r?('RIR '+r):''; }
function key(){ return wi+'|'+di; }
function exKey(ei){ return key()+'|'+ei; }
function bestFor(k){ var a=LOG[k]||[]; var b=0; a.forEach(function(s){ if(s.w*s.r>b)b=s.w*s.r; }); return b; }

function renderNav(){
  var wl=weeksList();
  document.getElementById('wkLabel').style.display=wl.length>1?'':'none';
  document.getElementById('weeks').innerHTML=wl.map(function(x,i){
    return '<button class="nchip'+(i===wi?' on':'')+'" onclick="pickWeek('+i+')">Wk '+x.week+'</button>';
  }).join('');
  var wkKey=(wl[wi]?((wl[wi].block||'')+'|'+wl[wi].week):'');
  var days=daysForWeek(wkKey);
  document.getElementById('dayLabel').style.display=days.length?'':'none';
  document.getElementById('days').innerHTML=days.map(function(x,i){
    return '<button class="nchip'+(i===di?' on':'')+'" onclick="pickDay('+i+')">'+esc(x.day)+'</button>';
  }).join('');
}
function currentDay(){ var wl=weeksList(); var wkKey=(wl[wi]?((wl[wi].block||'')+'|'+wl[wi].week):''); return daysForWeek(wkKey)[di]; }
function coachRec(ei,ex){ var sets=LOG[exKey(ei)]||[]; var r=rng(ex.repRange); var need=+((ex.workingSets||'').match(/\d+/)||[3])[0]||3;
  if(sets.length<need) return null; var work=sets.slice(-need);
  if(work.every(function(s){return s.r>=r[1];})) return 'You hit the top of the range on every set. Add weight next time.';
  if(work.some(function(s){return s.r<r[0];})) return 'That was heavy. Hold this weight and build back to '+r[0]+' clean reps.';
  return 'Stay here and add reps until you hit '+r[1]+' on every set, then go heavier.';
}
var HIDDEN={}, PANEL={}, NOTES={}, BW={};      // removed-for-today · open panel · personal notes · bodyweight-mode
try{ NOTES=JSON.parse(localStorage.getItem('lp_myprog_notes')||'{}'); }catch(e){}
var ADDED={}; try{ ADDED=JSON.parse(localStorage.getItem('lp_myprog_added')||'{}'); }catch(e){ ADDED={}; }   // exercises YOU add to a day
/* The day's exercises = the program's list + anything you added to this week|day. */
function dayExs(){ var d=currentDay(); return ((d&&d.exercises)||[]).concat(ADDED[key()]||[]); }
function addExercise(){
  var el=document.getElementById('addName'); var nm=(el&&el.value||'').trim(); if(!nm) return;
  var k=key(); ADDED[k]=ADDED[k]||[]; ADDED[k].push({exercise:nm, workingSets:'3', repRange:'8-12', added:true});
  try{ localStorage.setItem('lp_myprog_added', JSON.stringify(ADDED)); }catch(e){}
  renderList();
  try{ var cards=document.querySelectorAll('#list .kx'); if(cards.length) cards[cards.length-1].scrollIntoView({behavior:'smooth',block:'center'}); }catch(e){}
}
/* Tap a logged set to remove it (mis-log fix). */
function delSet(ei,si){ var k=exKey(ei); var a=LOG[k]||[]; if(si<0||si>=a.length) return; var s=a[si];
  if(!confirm('Remove this set?  '+(s.bw?'BW':s.w+' lb')+' × '+s.r+' reps')) return;
  a.splice(si,1); if(a.length) LOG[k]=a; else delete LOG[k];
  try{ localStorage.setItem('lp_myprog', JSON.stringify(LOG)); }catch(e){} syncLog(); renderList(); }
function renderList(){
  var d=currentDay(); if(!d){ document.getElementById('list').innerHTML='<div class="load">No day selected.</div>'; return; }
  var exs=dayExs();
  var html='<div class="kx-hint">ⓘ Set your weight and reps, then tap Log set. No weight? Tap Use bodyweight.</div>';
  html+=exs.map(function(ex,ei){
    if(HIDDEN[exKey(ei)]) return '';
    var name=SWAPS[exKey(ei)]||ex.exercise;
    var r=rng(ex.repRange); var need=+((ex.workingSets||'').match(/\d+/)||[3])[0]||3;
    var sets=LOG[exKey(ei)]||[]; var done=sets.length>=need;
    var startW=sets.length?sets[sets.length-1].w:0;
    var note=ex.note||'';
    var bw=!!BW[exKey(ei)];                                  // bodyweight mode for this exercise (this session)
    var startR=sets.length?sets[sets.length-1].r:r[0];       // reps input seeds from your last set, else bottom of range
    var logged=sets.map(function(s,si){ var tag=s.bw?'BW':(s.w+' lb'); return '<div class="kx-bub done" onclick="delSet('+ei+','+si+')" title="Tap to remove this set">'+s.r+' reps<span class="bw">'+tag+(s.pr?' <span class="pr">★</span>':'')+'</span><span class="xrm">✕</span></div>'; }).join('');
    var lp=sets.length?sets[sets.length-1]:null;
    var prev=lp?((lp.bw?'Bodyweight':(lp.w+' lb'))+' × '+lp.r+' reps'):'—';
    var ssNext=!!(SS[exKey(ei)]||ex.superset);                 // supersetted with the next exercise
    var ssPrev=ei>0 && !!(SS[exKey(ei-1)]||(exs[ei-1]&&exs[ei-1].superset));
    var infoId='info'+ei;
    return '<div class="kx'+(done?' done':'')+((ssNext||ssPrev)?' ss':'')+'">'
      +'<div class="kx-top"><div class="kx-thumb">▶</div><div class="kx-nm">'+esc(name)+'</div></div>'
      +'<div class="kx-actions"><button class="kx-tool" onclick="toggleKxPanel('+ei+',\'swap\')">⇄ Switch</button>'
      +(ei<exs.length-1?'<button class="kx-tool'+(ssNext?' on':'')+'" onclick="toggleSS('+ei+')">⛓ Superset</button>':'')+'</div>'
      +(note?'<div class="kx-info clip" id="'+infoId+'"><span class="ii">ⓘ</span> '+esc(note)+'</div><span class="kx-more" id="more'+ei+'" onclick="toggleInfo('+ei+')">Show more ▾</span>':'')
      +'<div class="kx-btns"><button class="kx-btn" onclick="toggleKxPanel('+ei+',\'edit\')">✎ Edit</button>'
      +'<button class="kx-btn" onclick="toggleKxPanel('+ei+',\'history\')">↻ History</button>'
      +'<button class="kx-btn" onclick="toggleKxPanel('+ei+',\'notes\')">▤ Notes</button></div>'
      +'<div id="panel'+ei+'">'+panelHTML(ei,ex)+'</div>'
      +'<div class="kx-sets"><div class="sl">Sets</div><div class="sr">'+need+' × '+esc(ex.repRange||'')+' reps · '+sets.length+'/'+need+' done</div></div>'
      +(logged?'<div class="kx-bubbles">'+logged+'</div>':'')
      +'<div class="kx-logger">'
      +(bw?'':'<div class="kx-field"><div class="k">Weight (lb)</div><div class="kx-step"><button class="kx-sbtn" onclick="wbump('+ei+',-5)">−</button><input class="kx-wv" id="kw'+ei+'" type="number" inputmode="decimal" step="2.5" value="'+startW+'"><button class="kx-sbtn" onclick="wbump('+ei+',5)">+</button></div></div>')
      +'<div class="kx-field"><div class="k">Reps</div><div class="kx-step"><button class="kx-sbtn" onclick="rbump('+ei+',-1)">−</button><input class="kx-wv" id="kr'+ei+'" type="number" inputmode="numeric" step="1" value="'+startR+'"><button class="kx-sbtn" onclick="rbump('+ei+',1)">+</button></div></div>'
      +'</div>'
      +'<button class="kx-bwtoggle'+(bw?' on':'')+'" onclick="toggleBW('+ei+')">'+(bw?'✓ Logging at bodyweight':'Use bodyweight (no weight)')+'</button>'
      +'<button class="kx-logbtn" onclick="logSet('+ei+')">Log set</button>'
      +'<div class="kx-prev">Previous lift: '+esc(prev)+'</div>'
      +'<div class="kx-delrow"><button class="kx-del" onclick="delEx('+ei+')">🗑 Delete exercise</button></div>'
      +'</div>'
      +((ssNext && ei<exs.length-1)?'<div class="kx-sslink"><span>⛓ Superset</span></div>':'');
  }).join('');
  html+='<div class="kx-add"><input id="addName" type="text" placeholder="Add an exercise…" onkeydown="if(event.key===\'Enter\')addExercise()"><button onclick="addExercise()">+ Add exercise</button></div>';
  document.getElementById('list').innerHTML=html;
  var doneN=exs.filter(function(_,ei){var need=+((exs[ei].workingSets||'').match(/\d+/)||[3])[0]||3;return (LOG[exKey(ei)]||[]).length>=need;}).length;
  var totalSets=exs.reduce(function(a,_,ei){return a+((LOG[exKey(ei)]||[]).length);},0);
  var pe=document.getElementById('prog'); if(pe) pe.textContent=doneN+' of '+exs.length+' exercises · '+totalSets+' sets logged';
}
/* Per-exercise expandable panel: Switch / Edit / History / Notes. */
function panelHTML(ei,ex){
  var kind=PANEL[exKey(ei)]; if(!kind) return '';
  var activeName=SWAPS[exKey(ei)]||ex.exercise;
  if(kind==='swap'){
    var opts=[ex.exercise,ex.sub1,ex.sub2].filter(Boolean); var custActive=opts.indexOf(activeName)<0;
    return '<div class="kx-panel"><div style="font-weight:800;color:#fff;margin-bottom:8px">Switch exercise</div>'
      +(custActive?'<button class="kx-btn" style="width:100%;justify-content:flex-start;margin-bottom:6px;color:var(--gold)">✓ '+esc(activeName)+' (yours)</button>':'')
      +opts.map(function(nm){var on=(nm===activeName);return '<button class="kx-btn" style="width:100%;justify-content:flex-start;margin-bottom:6px;'+(on?'color:var(--gold);border-color:var(--gold-dim)':'')+'" data-nm="'+esc(nm).replace(/"/g,'&quot;')+'" onclick="swapTo('+ei+',this.getAttribute(\'data-nm\'))">'+(on?'✓ ':'')+esc(nm)+'</button>';}).join('')
      +'<div style="display:flex;gap:8px;margin-top:6px"><input class="kx-wv" style="flex:1;width:auto;text-align:left;font-size:.9rem;font-family:inherit;font-weight:600;background:rgba(0,0,0,.25);border:1px solid var(--field-line);border-radius:9px;padding:9px" id="cust'+ei+'" type="text" placeholder="Type your own"><button class="kx-tool" onclick="swapCustom('+ei+')">Use</button></div></div>';
  }
  if(kind==='edit'){
    return '<div class="kx-panel"><div style="font-weight:800;color:#fff;margin-bottom:8px">Add a set manually</div>'
      +'<div style="display:flex;gap:8px;align-items:end"><div><div style="font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);font-weight:700">Weight</div><input class="kx-wv" id="ew'+ei+'" type="number" step="2.5" value="'+((LOG[exKey(ei)]||[]).slice(-1)[0]||{}).w+'" style="width:70px"></div>'
      +'<div><div style="font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);font-weight:700">Reps</div><input class="kx-wv" id="er'+ei+'" type="number" step="1" value="'+rng(ex.repRange)[0]+'" style="width:60px"></div>'
      +'<button class="kx-tool" style="padding:11px 14px" onclick="logManual('+ei+')">Add set</button></div></div>';
  }
  if(kind==='history'){
    var sets=LOG[exKey(ei)]||[]; var best=bestFor(exKey(ei));
    var rows=sets.length?sets.map(function(s,i){return '<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--field-line)"><span>Set '+(i+1)+'</span><b style="color:#fff">'+s.w+' lb × '+s.r+(s.pr?' ★':'')+'</b></div>';}).join(''):'<div style="color:var(--soft)">No sets logged yet.</div>';
    return '<div class="kx-panel"><div style="font-weight:800;color:#fff;margin-bottom:8px">This session</div>'+rows+(best?'<div style="margin-top:8px;color:var(--gold);font-weight:700">Best set volume: '+best+'</div>':'')+'</div>';
  }
  if(kind==='notes'){
    var nv=NOTES[exKey(ei)]||'';
    return '<div class="kx-panel"><div style="font-weight:800;color:#fff;margin-bottom:8px">Your notes</div>'
      +'<textarea id="nt'+ei+'" placeholder="Cues, tweaks, how it felt…">'+esc(nv)+'</textarea>'
      +'<button class="kx-tool" style="margin-top:8px" onclick="saveNote('+ei+')">Save note</button></div>';
  }
  return '';
}
function toggleKxPanel(ei,kind){ var k=exKey(ei); PANEL[k]=(PANEL[k]===kind?null:kind); renderList(); }
function toggleInfo(ei){ var el=document.getElementById('info'+ei), m=document.getElementById('more'+ei); if(!el)return; var clip=el.classList.toggle('clip'); if(m) m.textContent=clip?'Show more ▾':'Show less ▴'; }
function wbump(ei,d){ var el=document.getElementById('kw'+ei); if(!el)return; var v=(parseFloat(el.value)||0)+d; el.value=Math.max(0,Math.round(v*2)/2); }
function rbump(ei,d){ var el=document.getElementById('kr'+ei); if(!el)return; el.value=Math.max(1,(parseInt(el.value,10)||0)+d); }
function toggleBW(ei){ BW[exKey(ei)]=!BW[exKey(ei)]; renderList(); }
/* Most recent bodyweight: published by the app (client.html) to a shared same-origin key; falls
   back to the last bodyweight set logged on this device. Used to score bodyweight moves into tonnage. */
function latestBodyweight(){
  var w=0; try{ w=parseFloat(localStorage.getItem('lp_bodyweight'))||0; }catch(e){}
  if(w>0) return w;
  try{ for(var k in LOG){ var a=LOG[k]||[]; for(var i=a.length-1;i>=0;i--){ if(a[i].bw && a[i].w>0) return a[i].w; } } }catch(e){}
  return 0;
}
function logRep(ei,reps){ var w=parseFloat((document.getElementById('kw'+ei)||{}).value)||0; pushSet(ei,w,reps); }
/* Log a set from the typed Weight + Reps fields; in bodyweight mode the score uses the member's
   most recent bodyweight (never shown) so the end-of-workout tonnage still counts the move. */
function logSet(ei){
  var bw=!!BW[exKey(ei)];
  var r=parseInt((document.getElementById('kr'+ei)||{}).value,10)||0; if(!r) return;
  var w=bw?latestBodyweight():(parseFloat((document.getElementById('kw'+ei)||{}).value)||0);
  pushSet(ei,w,r,bw);
}
function logManual(ei){ var w=parseFloat((document.getElementById('ew'+ei)||{}).value)||0, r=parseInt((document.getElementById('er'+ei)||{}).value,10)||0; if(r){ PANEL[exKey(ei)]=null; pushSet(ei,w,r); } }
function pushSet(ei,w,r,bw){ if(!r) return; var prev=bestFor(exKey(ei)); var pr=(w*r)>prev&&prev>0; LOG[exKey(ei)]=LOG[exKey(ei)]||[]; LOG[exKey(ei)].push({w:w,r:r,pr:pr,bw:!!bw}); try{ localStorage.setItem('lp_myprog', JSON.stringify(LOG)); }catch(e){} markSet(); syncLog(); renderList(); }
function delEx(ei){ if(!confirm('Remove this exercise for today?')) return; HIDDEN[exKey(ei)]=1; renderList(); }
function saveNote(ei){ var el=document.getElementById('nt'+ei); if(!el)return; NOTES[exKey(ei)]=el.value; try{ localStorage.setItem('lp_myprog_notes', JSON.stringify(NOTES)); }catch(e){} PANEL[exKey(ei)]=null; renderList(); }
/* Day OVERVIEW — shown first when a day opens: title, description, exercise list, Start Workout. */
function renderOverview(){
  var d=currentDay(); if(!d){ document.getElementById('list').innerHTML='<div class="load">No day selected.</div>'; return; }
  var exs=dayExs();
  var mins=Math.max(30, Math.round(exs.length*7/5)*5);
  var desc='Your '+(d.day||'training')+' session. Warm up, hit your working sets inside the rep range, and log every set — the app remembers your numbers for next time.';
  var rows=exs.map(function(ex,ei){
    var nm=SWAPS[exKey(ei)]||ex.exercise;
    var sr=(ex.workingSets||'')+' sets · '+(ex.repRange||'')+' reps';
    return '<div class="ovex"><div class="ovthumb">▶</div><div class="ovb"><div class="ovnm">'+esc(nm)+'</div><div class="ovsr">'+esc(sr)+'</div></div></div>';
  }).join('');
  document.getElementById('list').innerHTML=
    '<div class="ovhero"><div class="ovttl">'+esc(d.day||'Workout')+'</div>'
    +'<div class="ovpills"><span class="ovpill">'+mins+' min</span><span class="ovpill">'+exs.length+' exercises</span></div></div>'
    +'<div class="ovdesc">'+esc(desc)+'</div>'
    +'<div class="ovh">Exercises</div>'+rows;
}
function setBar(){
  var fb=document.getElementById('finishBar'); if(!fb) return;
  fb.style.display='';
  if(MODE==='overview'){
    fb.innerHTML='<div class="fin-in"><button class="fbtn" style="width:100%" onclick="startWorkout()">Start Workout →</button></div>';
  } else {
    fb.innerHTML='<div class="fin-in"><div class="prog" id="prog"></div><button class="fbtn" onclick="finish()">Finish workout ✓</button></div>';
  }
}
function toggleNav(show){
  ["wkLabel","weeks","dayLabel","days"].forEach(function(id){ var el=document.getElementById(id); if(el) el.style.display=show?'':'none'; });
}
function startWorkout(){ MODE='active'; render(); window.scrollTo(0,0); }
function render(){
  var ov=(MODE==='overview');
  renderNav();
  toggleNav(!ov);
  var tb=document.getElementById('timerBar'); if(tb) tb.style.display=ov?'none':'';
  setBar();
  if(ov) renderOverview(); else renderList();
}
function pickWeek(i){ wi=i; di=0; openIdx=0; render(); }
function pickDay(i){ di=i; openIdx=0; render(); window.scrollTo(0,0); }
function toggle(i){ openIdx=(openIdx===i?-1:i); startClock(); renderList(); }
function bump(ei,f,d){ var el=document.getElementById(f+ei); var v=(parseFloat(el.value)||0)+d; if(f==='w')v=Math.max(0,Math.round(v*2)/2); if(f==='r')v=Math.max(1,Math.round(v)); el.value=v; }
function saveSet(ei){ var w=parseFloat(document.getElementById('w'+ei).value)||0, r=parseInt(document.getElementById('r'+ei).value,10)||0; if(!r){ return; } var prev=bestFor(exKey(ei)); var pr=(w*r)>prev&&prev>0; LOG[exKey(ei)]=LOG[exKey(ei)]||[]; LOG[exKey(ei)].push({w:w,r:r,pr:pr}); try{ localStorage.setItem('lp_myprog', JSON.stringify(LOG)); }catch(e){} markSet(); renderList(); }
/* Two clocks, both MANUAL: Workout (Start/Pause button; accumulates elapsed, never auto-starts)
   and Rest (the "Start rest" button begins/restarts a rest count-up; logging a set no longer
   touches it, so you control rest yourself). */
var sessionStart=null, sessionElapsed=0, running=false, lastSet=null, restRunning=false, CLK=null;
function fmt(s){ var h=Math.floor(s/3600),m=Math.floor((s%3600)/60),ss=s%60; return (h?h+':'+('0'+m).slice(-2):''+m)+':'+('0'+ss).slice(-2); }
function ensureCLK(){ if(!CLK)CLK=setInterval(tick,1000); tick(); }
function tick(){ var now=Date.now();
  var a=document.getElementById('wkTime'); if(a){ var el=sessionElapsed+((running&&sessionStart)?Math.floor((now-sessionStart)/1000):0); a.textContent=fmt(el); }
  var b=document.getElementById('restTime'); if(b) b.textContent=(restRunning&&lastSet)?fmt(Math.floor((now-lastSet)/1000)):'0:00';
  persistTimer(); }
function updateStartBtn(){ var btn=document.getElementById('startBtn'); if(btn) btn.textContent=running?'Pause':(sessionElapsed>0?'Resume':'Start'); }
function toggleWorkoutClock(){
  if(running){ sessionElapsed+=Math.floor((Date.now()-sessionStart)/1000); running=false; sessionStart=null; }
  else { sessionStart=Date.now(); running=true; ensureCLK(); }
  updateStartBtn(); tick();
}
function startRest(){ lastSet=Date.now(); restRunning=true; var rb=document.getElementById('restBtn'); if(rb) rb.textContent='Reset rest'; ensureCLK(); tick(); }
function markSet(){ ensureCLK(); }          // logging keeps the display ticking; it does NOT start the clock or the rest timer
function startClock(){ ensureCLK(); }       // legacy no-op shim (opening an exercise no longer auto-starts the workout)
/* Persist the live timer every tick so closing the app or leaving it idle resumes where it left off. */
function persistTimer(){
  try{
    var wEl=sessionElapsed+((running&&sessionStart)?Math.floor((Date.now()-sessionStart)/1000):0);
    var rEl=(restRunning&&lastSet)?Math.floor((Date.now()-lastSet)/1000):0;
    if(!wEl && !running && !restRunning){ localStorage.removeItem('lp_myprog_timer'); return; }
    localStorage.setItem('lp_myprog_timer', JSON.stringify({w:wEl,wr:running,r:rEl,rr:restRunning,ts:Date.now()}));
  }catch(e){}
}
var TIMER_RESUMED=false;
function restoreTimer(){
  try{
    var s=JSON.parse(localStorage.getItem('lp_myprog_timer')||'null'); if(!s) return;
    if(Date.now()-(s.ts||0) > 6*3600*1000){ localStorage.removeItem('lp_myprog_timer'); return; }   // >6h old = a new session, don't resume
    sessionElapsed=+s.w||0; running=!!s.wr; sessionStart=running?Date.now():null;    // resume the VALUE; time spent closed isn't added
    restRunning=!!s.rr; lastSet=restRunning?(Date.now()-(+s.r||0)*1000):null;
    TIMER_RESUMED=(sessionElapsed>0||running||restRunning);
    if(running||restRunning) ensureCLK();
  }catch(e){}
}
/* Finish -> the celebration SCREEN: tonnage (with an image), new PRs, and where to add
   weight next time (exercises where every working set hit the top of the rep range). */
function nounFor(s){ return s.count+' '+(s.count===1?s.name:s.plural); }
/* Tonnage for THIS workout only (the current day's exercises), not the whole program. */
function tonnageThisWorkout(){
  var exs=dayExs(), t=0;
  for(var ei=0;ei<exs.length;ei++){ var sets=LOG[exKey(ei)]||[]; for(var i=0;i<sets.length;i++){ t+=(+sets[i].w||0)*(+sets[i].r||0); } }
  return Math.round(t);
}
/* Which theme drives the comparison — default 'animals'; a Conquer Challenge can set
   window.TONNAGE_THEME to a character theme later (integration hook). */
function tonnageWhich(){ return (typeof window!=='undefined' && window.TONNAGE_THEME) ? 'characters' : 'animals'; }
function finish(){
  var lb = tonnageThisWorkout();
  /* Mark this week|day done so the app Home shows a green ✓ (shared same-origin key). */
  try{ var _dn=JSON.parse(localStorage.getItem('lp_workout_done')||'{}'); _dn[wi+'|'+di]=new Date().toISOString().slice(0,10); localStorage.setItem('lp_workout_done', JSON.stringify(_dn)); }catch(e){}
  /* Workout over — reset the timer so the next session starts clean. */
  try{ localStorage.removeItem('lp_myprog_timer'); }catch(e){}
  sessionElapsed=0; running=false; sessionStart=null; restRunning=false; lastSet=null; updateStartBtn();
  var say = (typeof tonnageSay==='function') ? tonnageSay(lb, tonnageWhich()) : null;
  document.getElementById('celEmoji').textContent = (say&&say.emoji)||'🏋️';
  document.getElementById('celNum').textContent = lb.toLocaleString()+' lb';
  document.getElementById('celCmp').innerHTML = say ? ('That’s <b>'+nounFor(say)+'</b>') : '';

  var exs=dayExs(), prs=[], level=[];
  exs.forEach(function(ex,ei){
    var name=SWAPS[exKey(ei)]||ex.exercise||ex.name||('Exercise '+(ei+1));
    var sets=LOG[exKey(ei)]||[]; if(!sets.length) return;
    var prSet=null; sets.forEach(function(s){ if(s.pr && (!prSet || s.w*s.r>prSet.w*prSet.r)) prSet=s; });
    if(prSet) prs.push({name:name,w:prSet.w,r:prSet.r,bw:!!prSet.bw});
    var r=rng(ex.repRange), need=+((ex.workingSets||'').match(/\d+/)||[3])[0]||3;
    if(sets.length>=need){ var work=sets.slice(-need);
      if(!work[work.length-1].bw && work.every(function(s){return s.r>=r[1];})){ var w=work[work.length-1].w; level.push({name:name,from:w,to:w+5}); } }
  });
  var prBox=document.getElementById('celPRs');
  if(prs.length){ prBox.style.display=''; document.getElementById('celPRList').innerHTML=prs.map(function(p){ return '<div class="cel-row"><span>'+esc(p.name)+'</span><b>'+(p.bw?'BW':(p.w+' lb'))+' × '+p.r+'</b></div>'; }).join(''); }
  else prBox.style.display='none';
  var lvBox=document.getElementById('celLevel');
  if(level.length){ lvBox.style.display=''; document.getElementById('celLevelList').innerHTML=level.map(function(l){ return '<div class="cel-row"><span>'+esc(l.name)+'</span><b>'+l.from+' → '+l.to+' lb</b></div>'; }).join(''); }
  else lvBox.style.display='none';

  window._celShareText = 'I moved '+lb.toLocaleString()+' lb'+(say?(' — that’s '+nounFor(say)+' '+say.emoji):'')+'! 💪 #BuiltForMore #LegacyPerformance';
  var card=document.querySelector('.cel-card'); if(card) card.scrollTop=0;
  document.getElementById('celebrate').style.display='flex';
}
function closeCelebrate(){ document.getElementById('celebrate').style.display='none'; }
/* Share → copy the stat + open the Skool community thread so they can paste and celebrate
   with everyone. TODO(Jayme): point SKOOL_WORKOUT_THREAD at the specific workout-share thread. */
var SKOOL_WORKOUT_THREAD = "https://www.skool.com/legacy-performance";
function shareTonnage(){
  var text=window._celShareText||'Just crushed a workout. 💪 #BuiltForMore';
  try{ navigator.clipboard.writeText(text); }catch(e){}
  var b=document.getElementById('celShare'); if(b){ var o=b.textContent; b.textContent='Copied — opening the community…'; setTimeout(function(){ b.textContent=o; }, 2400); }
  window.open(SKOOL_WORKOUT_THREAD, '_blank', 'noopener');
}

/* DEPLOYABLE loader — this file holds NO program content. Your program rides in your PRIVATE
   link's #fragment (gzip+base64) and is cached to this device only. Nothing on the server. */
function bootProg(j){
  PROG=j;
  document.getElementById('title').textContent=(j.title||'My Training').replace(/\.xlsx$/i,'').replace(/_/g,' ');
  if(j.notes){ document.getElementById('notesWrap').innerHTML='<details class="pnotes"><summary>Program notes</summary><div class="body">'+esc(j.notes)+'</div></details>'; }
  document.getElementById('timerBar').style.display='';
  document.getElementById('finishBar').style.display='';
  /* Home passes ?week=N & ?day=N to open that day directly. */
  try{ var _q=new URLSearchParams(location.search);
    var _wp=_q.get('week'); if(_wp!=null){ var _wi=parseInt(_wp,10); if(isFinite(_wi)&&_wi>=0) wi=_wi; }
    var _dp=_q.get('day'); if(_dp!=null){ var _di=parseInt(_dp,10); if(isFinite(_di)&&_di>=0) di=_di; }
  }catch(e){}
  restoreTimer();                 // resume a workout in progress (timer + rest) if there is one
  if(TIMER_RESUMED) MODE='active'; // land straight back in the session, not the overview
  render();
  updateStartBtn();
}
async function ungz(b64){
  var bin=atob(String(b64).replace(/\s+/g,'')), by=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) by[i]=bin.charCodeAt(i);
  var s=new Blob([by]).stream().pipeThrough(new DecompressionStream('gzip'));
  return await new Response(s).text();
}
/* Self-recovery: if there's no program cached on this device (fresh install, cleared data),
   pull it straight from the doorway using the identity the app saved (same-origin localStorage),
   so the program is always available — no "load once" link needed. */
var DOORWAY="https://script.google.com/macros/s/AKfycbzawUtTobA9Jfne8Hot7K7AIgnMp4izfYUo773nSKOZN4Z5xFNf3d9hDY6B-FMGdgV-/exec";
function fetchProgramFromServer(done){
  var tok=null, em=null;
  try{ tok=localStorage.getItem('lp_client_token'); }catch(e){}
  try{ var id=JSON.parse(localStorage.getItem('lp_client_id')||'null'); em=id&&id.email; }catch(e){}
  var q = tok?("token="+encodeURIComponent(tok)) : (em?("email="+encodeURIComponent(em)) : null);
  if(!q){ done(false); return; }
  document.getElementById('list').innerHTML='<div class="load">Loading your training…</div>';
  var cb="__lpprog"+Date.now(), s=document.createElement('script'), fin=false;
  function end(ok){ if(fin) return; fin=true; try{delete window[cb];}catch(e){} try{s.remove();}catch(e){} done(ok); }
  window[cb]=function(data){
    try{ var rows=data&&data.program, last=(rows&&rows.length)?rows[rows.length-1]:null, b64=last&&last['Program'];
      if(!b64){ end(false); return; }
      ungz(b64).then(function(txt){ if(txt&&txt.charAt(0)==='{'){ try{localStorage.setItem('lp_prog_data',txt);}catch(e){} bootProg(JSON.parse(txt)); end(true); } else end(false); }).catch(function(){ end(false); });
    }catch(e){ end(false); }
  };
  s.onerror=function(){ end(false); };
  s.src=DOORWAY+"?action=clientData&"+q+"&callback="+cb;
  document.body.appendChild(s);
  setTimeout(function(){ end(false); }, 20000);   // generous: a cold Apps Script can take 10-20s to wake
}
/* ===== LOG SYNC — back the logged sets up to the server so a new/wiped device restores them. ===== */
function lpIdentityQ(){
  var tok=null, em=null;
  try{ tok=localStorage.getItem('lp_client_token'); }catch(e){}
  try{ var id=JSON.parse(localStorage.getItem('lp_client_id')||'null'); em=id&&id.email; }catch(e){}
  return { tok:tok, em:em };
}
async function gz(text){   // gzip+base64 (mirror of ungz) for sending the log compactly
  var s=new Blob([text]).stream().pipeThrough(new CompressionStream('gzip'));
  var by=new Uint8Array(await new Response(s).arrayBuffer()), bin='';
  for(var i=0;i<by.length;i++) bin+=String.fromCharCode(by[i]);
  return btoa(bin);
}
var _logSyncT=null;
function syncLog(){   // debounced: push the whole log to the doorway after a change
  var who=lpIdentityQ(); if(!who.em) return;                 // need an email to key the row
  if(_logSyncT) clearTimeout(_logSyncT);
  _logSyncT=setTimeout(function(){
    gz(JSON.stringify(LOG)).then(function(b64){
      try{ fetch(DOORWAY, {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'},
        body:JSON.stringify({type:'workoutlog', email:who.em, token:who.tok||'', log:b64})}).catch(function(){}); }catch(e){}
    }).catch(function(){});
  }, 1200);
}
function syncDownLog(){   // on a device with no local log, restore it from the server
  try{ if(Object.keys(LOG||{}).length) return; }catch(e){ return; }
  var who=lpIdentityQ(); var q = who.tok?("token="+encodeURIComponent(who.tok)):(who.em?("email="+encodeURIComponent(who.em)):null);
  if(!q) return;
  var cb="__lplog"+Date.now(), s=document.createElement('script'), fin=false;
  function end(){ if(fin)return; fin=true; try{delete window[cb];}catch(e){} try{s.remove();}catch(e){} }
  window[cb]=function(data){
    try{ var rows=data&&data.workoutlog, last=(rows&&rows.length)?rows[rows.length-1]:null, b64=last&&last['Log'];
      if(!b64){ end(); return; }
      ungz(b64).then(function(txt){ try{ var obj=JSON.parse(txt);
        if(obj && Object.keys(obj).length && !Object.keys(LOG).length){ LOG=obj; try{localStorage.setItem('lp_myprog',txt);}catch(e){} renderList(); }
      }catch(e){} end(); }).catch(end);
    }catch(e){ end(); }
  };
  s.onerror=end; s.src=DOORWAY+"?action=clientData&"+q+"&callback="+cb; document.body.appendChild(s);
  setTimeout(end, 15000);
}
(async function(){
  var h=decodeURIComponent((location.hash||'').replace(/^#/,''));
  try{
    if(h){ var txt=await ungz(h); try{ localStorage.setItem('lp_prog_data', txt); }catch(e){} bootProg(JSON.parse(txt)); syncDownLog(); return; }
    var cached=localStorage.getItem('lp_prog_data'); if(cached){ bootProg(JSON.parse(cached)); syncDownLog(); return; }
    fetchProgramFromServer(function(ok){
      if(ok){ syncDownLog(); return; }
      fetchProgramFromServer(function(ok2){        // one retry — a cold Apps Script is often just slow to wake
        if(ok2){ syncDownLog(); return; }
        document.getElementById('list').innerHTML='<div class="load"><b style="color:#fff;font-size:1rem">Load your training once</b><br><br>Open the app from your login link once on this device — it loads your program and remembers it here, then your workouts open straight from the app.</div>';
      });
    });
  }catch(e){
    document.getElementById('list').innerHTML='<div class="load">Could not load your program on this browser.<br><span style="font-size:.8rem">Try Safari or Chrome (a recent version).</span></div>';
  }
})();
</script>
